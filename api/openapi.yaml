openapi: 3.0.3
info:
  title: Balnana API
  version: 0.1.0
  description: |
    Group expense splitting. See docs/PLAN.md for the access model.

    Money is always a decimal string (for example "1234.50"), never a JSON
    number. The number of decimal places is the group's `minorDigits`.
    Errors carry a stable machine `code`; clients translate it.

    Any request may be answered 429 with code `rate_limited` and a
    `Retry-After` header (seconds): per client there is a request cap
    (BALNANA_RATE_LIMIT) and a cap on asking for group tokens that do not
    exist.

    Accounts mode (BALNANA_AUTH_MODE=accounts): sign in with /auth/login or
    /auth/register. The web app asks for a session cookie (`cookie: true`);
    other clients get a token to send as `Authorization: Bearer <token>`.
    Group endpoints then need a session and membership in the group, unless
    the group has link access, in which case its link alone is enough, as in
    link mode. Without a session they answer 401 `sign_in_required`; for a
    signed-in non-member, 403 `not_a_member` (see /g/{token}/join).
servers:
  - url: /api/v1
security:
  - {}
  - bearer: []
  - cookie: []
paths:
  /server-info:
    get:
      operationId: getServerInfo
      summary: Mode and enabled features, read by the app on startup
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerInfo"
  /groups:
    post:
      operationId: createGroup
      summary: Create a group with its first members
      description: >-
        The response carries the secret token. In accounts mode the creator
        must be signed in and becomes the first member.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        default:
          $ref: "#/components/responses/Error"
  /groups/import:
    post:
      operationId: importGroup
      summary: Create a group from another app's export
      description: >-
        Reads a Settle Up CSV export and creates a group with its people,
        expenses and transfers, all in one go: if any row cannot be imported,
        nothing is. With `dryRun` nothing is stored and the response is a
        preview. Amounts in other currencies use the export's converted
        amounts, so the group has one currency. In accounts mode the creator
        must be signed in and say which person in the file they are (`me`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportInput"
      responses:
        "200":
          description: The preview, for `dryRun`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportPreview"
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        default:
          description: >-
            `import_file` (params.problem: `encoding`, `header`, `empty`,
            `too_many_rows`, `currency`) when the file is not a usable export;
            `import_row` (params.line, params.problem) for a row that cannot
            be imported; `import_me` when `me` is not a person in the file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /groups/summaries:
    post:
      operationId: getGroupSummaries
      summary: Home screen cards for the groups a device knows
      description: >-
        Tokens the server does not know (deleted, or the link was reset) are
        listed in `missing` so the app can forget them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupSummaryRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupSummaryList"
        default:
          $ref: "#/components/responses/Error"
  /auth/register:
    post:
      operationId: register
      summary: Create an account with email and password (accounts mode)
      description: >-
        Refused with 403 `signup_closed` when BALNANA_AUTH_SIGNUP is closed,
        or invite_only and there is no invitation for the address. The first
        account on a server can always be created.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Error"
  /auth/login:
    post:
      operationId: login
      summary: Sign in with email and password (accounts mode)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Error"
  /auth/logout:
    post:
      operationId: logout
      summary: End this session
      responses:
        "204":
          description: Signed out
        default:
          $ref: "#/components/responses/Error"
  /auth/verify-email:
    post:
      operationId: verifyEmail
      summary: Confirm an email address with the token from a verification email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailToken"
      responses:
        "204":
          description: Verified
        default:
          $ref: "#/components/responses/Error"
  /auth/password-reset:
    post:
      operationId: requestPasswordReset
      summary: Email a password reset link
      description: >-
        Answers the same whether or not an account has the address, so it
        cannot be used to find out who has an account. 403 `email_off` when
        the server has no email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "204":
          description: Sent, if the address has an account
        default:
          $ref: "#/components/responses/Error"
  /auth/password-reset/confirm:
    post:
      operationId: resetPassword
      summary: Set a new password with the token from a reset email
      description: Every session of the account is signed out.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordReset"
      responses:
        "204":
          description: Changed
        default:
          $ref: "#/components/responses/Error"
  /auth/oauth/{provider}/start:
    parameters:
      - $ref: "#/components/parameters/OAuthProviderId"
    get:
      operationId: startOAuth
      summary: Leave for the provider's sign-in page (opened in a browser)
      description: >-
        The app opens this in the browser rather than calling it. It comes
        back through the callback to `/oauth-done` in the web app, or to
        `balnana://app/oauth-done` in the Android app, with `next` and either
        `code` (Android: trade it with /auth/oauth/exchange) or `error`.
      parameters:
        - name: app
          in: query
          required: true
          schema:
            type: string
            enum: [web, android]
        - name: next
          in: query
          description: App path to open afterwards, such as `/groups`.
          schema:
            type: string
        - name: challenge
          in: query
          description: >-
            Android only: base64url SHA-256 of a random verifier the app keeps,
            sent again with the code to /auth/oauth/exchange.
          schema:
            type: string
      responses:
        "302":
          description: To the provider
          headers:
            Location:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /auth/oauth/{provider}/callback:
    parameters:
      - $ref: "#/components/parameters/OAuthProviderId"
    get:
      operationId: oauthCallback
      summary: Where the provider sends the browser back
      description: >-
        Signs in to the account with this provider identity. Otherwise an
        account with the same address, when the provider has verified it,
        gets the identity added; failing both, a new account is made when
        sign-up allows it. Errors: `oauth_failed`, `oauth_cancelled`,
        `email_taken` (an account has the address but has not confirmed it),
        `signup_closed`.
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
        - name: balnana_oauth
          in: cookie
          schema:
            type: string
      responses:
        "302":
          description: Back to the app
          headers:
            Location:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /auth/oauth/exchange:
    post:
      operationId: exchangeOAuthCode
      summary: Trade the code the Android app got back for a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthExchange"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Error"
  /auth/invites/{inviteToken}:
    parameters:
      - name: inviteToken
        in: path
        required: true
        description: The secret from an invitation email.
        schema:
          type: string
    get:
      operationId: getInvite
      summary: The invitation behind an invitation link
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteInfo"
        default:
          $ref: "#/components/responses/Error"
  /me:
    get:
      operationId: getMe
      summary: The signed-in account
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
  /me/password:
    post:
      operationId: changePassword
      summary: Set a new password; other sessions are signed out
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChange"
      responses:
        "204":
          description: Changed
        default:
          $ref: "#/components/responses/Error"
  /me/verify-email:
    post:
      operationId: sendVerifyEmail
      summary: Email a new verification link to the account's address
      responses:
        "204":
          description: Sent, or already verified
        default:
          $ref: "#/components/responses/Error"
  /me/groups:
    get:
      operationId: getMyGroups
      summary: Home screen cards for the groups the account is a member of
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupSummaryList"
        default:
          $ref: "#/components/responses/Error"
  /push/devices/{device}:
    parameters:
      - name: device
        in: path
        required: true
        description: The device's Firebase installation ID (FID), which FCM sends to.
        schema:
          type: string
          minLength: 1
          maxLength: 4096
    put:
      operationId: registerPushDevice
      summary: Send this device notifications about the groups it follows
      description: >-
        Replaces what the device was told about before. A signed-in device is
        also told about the account's groups, until the session ends. Groups
        the link alone does not open, unknown tokens and members not in the
        group are left out without an error. Only when `push` is on in
        /server-info; otherwise `push_off`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushDeviceInput"
      responses:
        "204":
          description: Registered
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: removePushDevice
      summary: Stop sending this device notifications
      responses:
        "204":
          description: Removed, or was never registered
        default:
          $ref: "#/components/responses/Error"
  /g/{token}:
    parameters:
      - $ref: "#/components/parameters/Token"
    get:
      operationId: getGroup
      summary: The group, its members and their balances
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateGroup
      parameters:
        - $ref: "#/components/parameters/ActingMember"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        default:
          $ref: "#/components/responses/Error"
  /g/{token}/reset-link:
    parameters:
      - $ref: "#/components/parameters/Token"
    post:
      operationId: resetGroupLink
      summary: Replace the token; the old link stops working
      parameters:
        - $ref: "#/components/parameters/ActingMember"
      responses:
        "200":
          description: The group under its new token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        default:
          $ref: "#/components/responses/Error"
  /g/{token}/join:
    parameters:
      - $ref: "#/components/parameters/Token"
    get:
      operationId: getJoinInfo
      summary: What a signed-in person needs to decide to join (accounts mode)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinInfo"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: joinGroup
      summary: Become a member, as a new member or by claiming a placeholder
      description: >-
        Joining again after leaving brings the old member back. Joining when
        already a member changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinInput"
      responses:
        "200":
          description: The group, now with you in it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        default:
          $ref: "#/components/responses/Error"
  /g/{token}/invites:
    parameters:
      - $ref: "#/components/parameters/Token"
    post:
      operationId: inviteToGroup
      summary: Email someone an invitation to the group (accounts mode)
      description: >-
        Optionally for one unclaimed member, whom the invited person is
        offered to join as. The invitation also lets them register on an
        invite_only server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteInput"
      responses:
        "204":
          description: Sent
        default:
          $ref: "#/components/responses/Error"
  /g/{token}/members:
    parameters:
      - $ref: "#/components/parameters/Token"
    post:
      operationId: addMember
      parameters:
        - $ref: "#/components/parameters/ActingMember"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        default:
          $ref: "#/components/responses/Error"
  /g/{token}/members/{memberId}:
    parameters:
      - $ref: "#/components/parameters/Token"
      - $ref: "#/components/parameters/MemberId"
    patch:
      operationId: updateMember
      parameters:
        - $ref: "#/components/parameters/ActingMember"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: removeMember
      summary: Mark a member as having left
      description: >-
        Only members whose balance is zero can leave. They stay in past
        expenses; error `member_has_balance` otherwise.
      parameters:
        - $ref: "#/components/parameters/ActingMember"
      responses:
        "204":
          description: Removed
        default:
          $ref: "#/components/responses/Error"
  /g/{token}/expenses:
    parameters:
      - $ref: "#/components/parameters/Token"
    get:
      operationId: listExpenses
      summary: Expenses and payments, newest first
      description: >-
        The filters combine; a cursor only works with the filters it was
        given with.
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: q
          in: query
          description: Text to find in the title or note, ignoring case.
          schema:
            type: string
            maxLength: 100
        - name: member
          in: query
          description: Only what this member paid or has a share in.
          schema:
            type: string
        - name: category
          in: query
          description: Only expenses of this category.
          schema:
            type: string
        - name: kind
          in: query
          schema:
            type: string
            enum: [expense, payment]
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpensePage"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createExpense
      parameters:
        - $ref: "#/components/parameters/ActingMember"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        default:
          $ref: "#/components/responses/Error"
  /g/{token}/expenses/{expenseId}:
    parameters:
      - $ref: "#/components/parameters/Token"
      - $ref: "#/components/parameters/ExpenseId"
    get:
      operationId: getExpense
      summary: One expense, also when deleted
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: updateExpense
      description: >-
        `version` must be the version that was read; otherwise the expense
        changed meanwhile and the answer is 409 `expense_version_conflict`.
      parameters:
        - $ref: "#/components/parameters/ActingMember"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteExpense
      summary: Delete (restorable)
      parameters:
        - $ref: "#/components/parameters/ActingMember"
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Error"
  /g/{token}/expenses/{expenseId}/restore:
    parameters:
      - $ref: "#/components/parameters/Token"
      - $ref: "#/components/parameters/ExpenseId"
    post:
      operationId: restoreExpense
      summary: Undo a delete
      parameters:
        - $ref: "#/components/parameters/ActingMember"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        default:
          $ref: "#/components/responses/Error"
  /g/{token}/payments:
    parameters:
      - $ref: "#/components/parameters/Token"
    post:
      operationId: createPayment
      summary: Record that one member paid another
      parameters:
        - $ref: "#/components/parameters/ActingMember"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInput"
      responses:
        "201":
          description: The payment, stored as an expense of kind `payment`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        default:
          $ref: "#/components/responses/Error"
  /g/{token}/balances:
    parameters:
      - $ref: "#/components/parameters/Token"
    get:
      operationId: getBalances
      summary: Net balances and the payments that settle them
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Balances"
        default:
          $ref: "#/components/responses/Error"
  /g/{token}/stats:
    parameters:
      - $ref: "#/components/parameters/Token"
    get:
      operationId: getStats
      summary: What the group spent, by category, member and month
      description: Payments between members are not spending and are left out.
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: utcOffset
          in: query
          description: Minutes east of UTC that months begin at, for the reader's time zone.
          schema:
            type: integer
            minimum: -840
            maximum: 840
            default: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupStats"
        default:
          $ref: "#/components/responses/Error"
  /g/{token}/activity:
    parameters:
      - $ref: "#/components/parameters/Token"
    get:
      operationId: listActivity
      summary: What happened in the group, newest first
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityPage"
        default:
          $ref: "#/components/responses/Error"
  /g/{token}/events:
    parameters:
      - $ref: "#/components/parameters/Token"
    get:
      operationId: groupEvents
      summary: Live notices that the group changed (server-sent events)
      description: >-
        A text/event-stream that stays open. It sends a `change` event
        whenever something in the group changes (no data: reload what is
        shown), comments to keep the connection alive, and a `gone` event
        before closing when the request may no longer see the group (link
        reset, removed from it, signed out). Events missed while not connected
        are not replayed, so reload after connecting.
      responses:
        "200":
          description: The event stream
          content:
            text/event-stream:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
components:
  parameters:
    Token:
      name: token
      in: path
      required: true
      description: The group's secret token from its link.
      schema:
        type: string
    MemberId:
      name: memberId
      in: path
      required: true
      schema:
        type: string
    ExpenseId:
      name: expenseId
      in: path
      required: true
      schema:
        type: string
    OAuthProviderId:
      name: provider
      in: path
      required: true
      description: An id from `oauthProviders` in /server-info.
      schema:
        type: string
    From:
      name: from
      in: query
      description: Only what happened at or after this time.
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      description: Only what happened before this time.
      schema:
        type: string
        format: date-time
    ActingMember:
      name: X-Balnana-Member
      in: header
      required: false
      description: >-
        Link mode: the member this device acts as, recorded in the activity
        log. Ignored when it is not a member of the group.
      schema:
        type: string
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
    cookie:
      type: apiKey
      in: cookie
      name: balnana_session
  responses:
    Error:
      description: >-
        An error. 400 for invalid input, 401 when signing in is needed, 403
        when not allowed, 404 for an unknown group or item, 409 for
        conflicts.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Money:
      type: string
      description: Decimal amount with up to the group's `minorDigits` decimals.
      example: "12.50"
    GroupCreate:
      type: object
      required: [name, currency, members]
      properties:
        name:
          type: string
        emoji:
          type: string
        color:
          type: integer
          description: 0xRRGGBB
        currency:
          type: string
          description: ISO 4217 code
          example: EUR
        minorDigits:
          type: integer
          minimum: 0
          maximum: 4
          default: 2
        members:
          type: array
          description: >-
            Names of the first members, the creator first. In accounts mode
            the first is the creator's name in this group.
          items:
            type: string
        linkAccess:
          type: boolean
          description: >-
            Accounts mode: let anyone with the link in, as in link mode.
            Ignored unless the server allows it (`linkGroups`).
    ImportInput:
      type: object
      required: [format, file]
      properties:
        format:
          type: string
          enum: [settle_up]
        file:
          type: string
          format: byte
          description: The exported file, base64. UTF-8 and UTF-16 are read.
        name:
          type: string
          description: The new group's name. Required unless `dryRun`.
        me:
          type: string
          description: >-
            Which person in the file the creator is. They become the owner;
            in accounts mode, required, and the member is linked to the
            account.
        untitled:
          type: string
          description: Title for expenses the file has no purpose for.
        dryRun:
          type: boolean
    ImportPreview:
      type: object
      required: [currency, minorDigits, members, expenses, payments, skipped]
      properties:
        currency:
          type: string
        minorDigits:
          type: integer
        members:
          type: array
          description: In the order they first appear in the file.
          items:
            $ref: "#/components/schemas/ImportMember"
        expenses:
          type: integer
        payments:
          type: integer
        skipped:
          type: integer
          description: Rows with a zero amount, which are left out.
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
    ImportMember:
      type: object
      required: [name, balance]
      properties:
        name:
          type: string
        balance:
          $ref: "#/components/schemas/Money"
    GroupUpdate:
      type: object
      properties:
        name:
          type: string
        emoji:
          type: string
          description: Empty string clears it.
        color:
          type: integer
        linkAccess:
          type: boolean
          description: >-
            Accounts mode, owners only, when the server allows it
            (`linkGroups`).
    Group:
      type: object
      required: [token, name, currency, minorDigits, createdAt, members, linkAccess]
      properties:
        token:
          type: string
        name:
          type: string
        emoji:
          type: string
        color:
          type: integer
        currency:
          type: string
        minorDigits:
          type: integer
        createdAt:
          type: string
          format: date-time
        members:
          type: array
          description: Everyone, including members who left, oldest first.
          items:
            $ref: "#/components/schemas/Member"
        linkAccess:
          type: boolean
          description: Whether the link alone opens the group (always in link mode).
        myMemberId:
          type: string
          description: 'Accounts mode: the signed-in account''s member, if any.'
    Member:
      type: object
      required: [id, name, left, balance, owner, claimed]
      properties:
        id:
          type: string
        name:
          type: string
        color:
          type: integer
        left:
          type: boolean
        owner:
          type: boolean
        claimed:
          type: boolean
          description: 'Accounts mode: an account is linked to this member.'
        balance:
          $ref: "#/components/schemas/Money"
    MemberInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        color:
          type: integer
    GroupSummaryRequest:
      type: object
      required: [groups]
      properties:
        groups:
          type: array
          maxItems: 200
          items:
            type: object
            required: [token]
            properties:
              token:
                type: string
              memberId:
                type: string
                description: Who this device is in the group, for `balance`.
    GroupSummaryList:
      type: object
      required: [groups, missing]
      properties:
        groups:
          type: array
          items:
            $ref: "#/components/schemas/GroupSummary"
        missing:
          type: array
          items:
            type: string
    GroupSummary:
      type: object
      required: [token, name, currency, minorDigits, memberCount, updatedAt]
      properties:
        token:
          type: string
        name:
          type: string
        emoji:
          type: string
        color:
          type: integer
        currency:
          type: string
        minorDigits:
          type: integer
        memberCount:
          type: integer
        balance:
          $ref: "#/components/schemas/Money"
        updatedAt:
          type: string
          format: date-time
          description: Last activity in the group.
    Share:
      type: object
      required: [memberId]
      properties:
        memberId:
          type: string
        value:
          type: string
          description: >-
            Ignored for `equal`; an amount for `exact`; a percentage for
            `percent`; a weight for `shares` (up to 4 decimals).
    PayerInput:
      type: object
      required: [memberId, amount]
      properties:
        memberId:
          type: string
        amount:
          $ref: "#/components/schemas/Money"
    ExpenseInput:
      type: object
      required: [title, amount, occurredAt, payers, splitMethod, splits]
      properties:
        title:
          type: string
        categoryId:
          type: string
        amount:
          $ref: "#/components/schemas/Money"
        occurredAt:
          type: string
          format: date-time
        note:
          type: string
        payers:
          type: array
          description: Who paid; the amounts add up to `amount`.
          items:
            $ref: "#/components/schemas/PayerInput"
        splitMethod:
          $ref: "#/components/schemas/SplitMethod"
        splits:
          type: array
          items:
            $ref: "#/components/schemas/Share"
        version:
          type: integer
          description: Required when updating.
    PaymentInput:
      type: object
      required: [fromMemberId, toMemberId, amount]
      properties:
        fromMemberId:
          type: string
        toMemberId:
          type: string
        amount:
          $ref: "#/components/schemas/Money"
        occurredAt:
          type: string
          format: date-time
          description: Defaults to now.
    SplitMethod:
      type: string
      enum: [equal, exact, percent, shares]
    Expense:
      type: object
      required: [id, kind, title, amount, occurredAt, splitMethod, payers, splits, createdAt, updatedAt, version]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [expense, payment]
        title:
          type: string
        categoryId:
          type: string
        amount:
          $ref: "#/components/schemas/Money"
        occurredAt:
          type: string
          format: date-time
        note:
          type: string
        splitMethod:
          $ref: "#/components/schemas/SplitMethod"
        payers:
          type: array
          items:
            $ref: "#/components/schemas/Payer"
        splits:
          type: array
          items:
            $ref: "#/components/schemas/SplitPart"
        createdBy:
          type: string
          description: Member id of whoever added it, when known.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
        version:
          type: integer
    Payer:
      type: object
      required: [memberId, amount]
      properties:
        memberId:
          type: string
        amount:
          $ref: "#/components/schemas/Money"
    SplitPart:
      type: object
      required: [memberId, amount]
      properties:
        memberId:
          type: string
        amount:
          $ref: "#/components/schemas/Money"
        share:
          type: string
          description: The percentage or weight entered, for `percent` and `shares`.
    ExpensePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Expense"
        nextCursor:
          type: string
    Balances:
      type: object
      required: [balances, transfers]
      properties:
        balances:
          type: array
          items:
            $ref: "#/components/schemas/MemberBalance"
        transfers:
          type: array
          description: Suggested payments that settle everyone up.
          items:
            $ref: "#/components/schemas/Transfer"
    GroupStats:
      type: object
      required: [total, count, categories, members, months]
      properties:
        total:
          $ref: "#/components/schemas/Money"
        count:
          type: integer
          description: How many expenses the total is made of.
        categories:
          type: array
          description: Largest first.
          items:
            $ref: "#/components/schemas/CategoryStats"
        members:
          type: array
          description: Every member who paid or had a share, in the group's member order.
          items:
            $ref: "#/components/schemas/MemberStats"
        months:
          type: array
          description: Oldest first, only months with spending.
          items:
            $ref: "#/components/schemas/MonthStats"
    CategoryStats:
      type: object
      required: [amount, count]
      properties:
        categoryId:
          type: string
          description: Absent for expenses without a category.
        amount:
          $ref: "#/components/schemas/Money"
        count:
          type: integer
    MemberStats:
      type: object
      required: [memberId, paid, share]
      properties:
        memberId:
          type: string
        paid:
          $ref: "#/components/schemas/Money"
        share:
          $ref: "#/components/schemas/Money"
          description: What the member's part of the expenses came to.
    MonthStats:
      type: object
      required: [month, amount]
      properties:
        month:
          type: string
          description: Year and month, as 2026-10.
        amount:
          $ref: "#/components/schemas/Money"
    MemberBalance:
      type: object
      required: [memberId, amount]
      properties:
        memberId:
          type: string
        amount:
          $ref: "#/components/schemas/Money"
    Transfer:
      type: object
      required: [fromMemberId, toMemberId, amount]
      properties:
        fromMemberId:
          type: string
        toMemberId:
          type: string
        amount:
          $ref: "#/components/schemas/Money"
    ActivityPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Activity"
        nextCursor:
          type: string
    Activity:
      type: object
      required: [id, action, payload, createdAt]
      properties:
        id:
          type: string
        action:
          type: string
          description: >-
            group.created, group.updated, group.link_reset, member.added,
            member.updated, member.removed, expense.created, expense.updated,
            expense.deleted, expense.restored. Payments use the expense
            actions with `kind: payment` in the payload.
        actorMemberId:
          type: string
        subjectId:
          type: string
        payload:
          type: object
          additionalProperties: true
          description: Names and amounts at the time, for rendering in any language.
        createdAt:
          type: string
          format: date-time
    RegisterInput:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
        password:
          type: string
          description: 8 to 200 characters.
        name:
          type: string
        locale:
          type: string
        cookie:
          type: boolean
          description: 'Web app: keep the session in a cookie instead of returning a token.'
        invite:
          type: string
          description: >-
            The secret from an invitation email for this address. It lets the
            account in on an invite_only server and verifies the address.
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
        cookie:
          type: boolean
          description: 'Web app: keep the session in a cookie instead of returning a token.'
    Session:
      type: object
      required: [user]
      properties:
        token:
          type: string
          description: 'Send as `Authorization: Bearer <token>`. Absent with `cookie: true`.'
        user:
          $ref: "#/components/schemas/User"
    User:
      type: object
      required: [id, name, emailVerified, hasPassword]
      properties:
        id:
          type: string
        email:
          type: string
        emailVerified:
          type: boolean
        name:
          type: string
        locale:
          type: string
        hasPassword:
          type: boolean
    UserUpdate:
      type: object
      properties:
        name:
          type: string
        locale:
          type: string
          description: Empty string follows the device.
    PasswordChange:
      type: object
      required: [newPassword]
      properties:
        currentPassword:
          type: string
          description: Required when the account has a password.
        newPassword:
          type: string
    OAuthExchange:
      type: object
      required: [code, verifier]
      properties:
        code:
          type: string
        verifier:
          type: string
    EmailToken:
      type: object
      required: [token]
      properties:
        token:
          type: string
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
    PasswordReset:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
        newPassword:
          type: string
    InviteInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
        memberId:
          type: string
          description: An unclaimed member the person is invited to join as.
    InviteInfo:
      type: object
      required: [email, groupToken, groupName]
      properties:
        email:
          type: string
        groupToken:
          type: string
        groupName:
          type: string
        invitedBy:
          type: string
          description: The name of the member who sent the invitation.
    JoinInfo:
      type: object
      required: [name, currency, members, member]
      properties:
        name:
          type: string
        emoji:
          type: string
        color:
          type: integer
        currency:
          type: string
        member:
          type: boolean
          description: The account is already a member.
        members:
          type: array
          description: Current members; unclaimed ones can be claimed.
          items:
            $ref: "#/components/schemas/JoinMember"
        invitedMemberId:
          type: string
          description: The unclaimed member the account was invited to join as.
    JoinMember:
      type: object
      required: [id, name, claimed]
      properties:
        id:
          type: string
        name:
          type: string
        color:
          type: integer
        claimed:
          type: boolean
    JoinInput:
      type: object
      properties:
        claimMemberId:
          type: string
          description: An unclaimed member to become.
        name:
          type: string
          description: Name for a new member; defaults to the account name.
    ServerInfo:
      type: object
      required: [name, version, authMode, password, signup, firstAccount, email, oauthProviders, linkGroups, push, publicUrl, sourceUrl]
      properties:
        name:
          type: string
          description: Always "balnana"; lets the app recognise a Balnana server.
          example: balnana
        version:
          type: string
          example: 0.1.0
        authMode:
          type: string
          enum: [link, accounts]
        password:
          type: boolean
          description: Email + password sign-in is available (accounts mode only).
        signup:
          type: string
          enum: [open, invite_only, closed]
        firstAccount:
          type: boolean
          description: >-
            No account exists yet, so the first one may sign up with a password
            even though signup is not open. Only ever true then.
        email:
          type: boolean
          description: The server can send email (verification, reset, invites).
        oauthProviders:
          type: array
          items:
            $ref: "#/components/schemas/OAuthProvider"
        linkGroups:
          type: boolean
          description: Groups may be opened by link alone. Always true in link mode.
        push:
          type: boolean
          description: >-
            The server sends push notifications through Firebase Cloud
            Messaging, to apps built with the same Firebase project.
        publicUrl:
          type: string
          description: Base URL used for group links.
          example: https://balnana.example.com
        sourceUrl:
          type: string
          description: >-
            Where to get this server's source code (AGPL-3.0). Defaults to the
            upstream repository.
          example: https://github.com/willie6666/balnana
    PushDeviceInput:
      type: object
      required: [groups]
      properties:
        groups:
          type: array
          maxItems: 200
          description: The link groups this device knows, and who it is in each.
          items:
            type: object
            required: [token, memberId]
            properties:
              token:
                type: string
              memberId:
                type: string
    OAuthProvider:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          example: google
        name:
          type: string
          example: Google
    Error:
      type: object
      required: [code]
      properties:
        code:
          type: string
          example: not_found
        params:
          type: object
          additionalProperties: true
