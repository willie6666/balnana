openapi: 3.0.3
info:
  title: Balnana API
  version: 0.1.0
  description: |
    Group expense splitting.

    Money is always a decimal string (for example "1234.50"), never a JSON
    number. The number of decimal places is the group's `minorDigits`.
    Errors carry a stable machine `code`; clients translate it.

    Any request may be answered 429 with code `rate_limited` and a
    `Retry-After` header (seconds): per client there is a request cap
    (BALNANA_RATE_LIMIT) and a cap on asking for group tokens that do not
    exist.

    Accounts mode (BALNANA_AUTH_MODE=accounts): sign in with /auth/login or
    /auth/register. The same-origin web app asks for a session cookie
    (`cookie: true`); Android and cross-origin web apps get a token to send as
    `Authorization: Bearer <token>`. Sessions last 90 days and extend on use,
    at most once per hour; there is no separate refresh endpoint.
    Group endpoints then need a session and membership in the group, unless
    the group has link access, in which case its link alone is enough, as in
    link mode. Without a session they answer 401 `sign_in_required`; for a
    signed-in non-member, 403 `not_a_member` (see /g/{token}/join).

    Billing: on a server that charges, adding past a plan's limit answers
    402 `plan_limit`, with the limit in `params` (`limit`, `max`). Ko-fi posts
    its payments as a form to /webhooks/kofi, and Google's Pub/Sub pushes
    Google Play's notifications to /webhooks/play. This contract leaves both
    out.

    Administration (/admin/...): one password, set once at /admin/setup
    while server-info says `setupRequired`. /admin/login trades it for a
    token to send as `X-Balnana-Admin`; without a valid one, admin
    endpoints answer 401 `admin_required`.
servers:
  - url: /api/v1
security:
  - {}
  - bearer: []
  - cookie: []
paths:
  /server-info:
    get:
      operationId: getServerInfo
      summary: Mode and enabled features, read by the app on startup
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerInfo"
  /admin/setup:
    post:
      operationId: adminSetup
      summary: Set the administrator password, once, on a new server
      description: >-
        Only while server-info says `setupRequired`; afterwards 409
        `already_set_up`. When server-info also says `setupCode`, the code the
        server printed in its log is needed too (403 `invalid_setup_code`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSetupInput"
      responses:
        "201":
          description: Set; signed in as the administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        default:
          $ref: "#/components/responses/Error"
  /admin/login:
    post:
      operationId: adminLogin
      summary: Sign in as the administrator
      description: 401 `invalid_credentials` for a wrong password, 409 `setup_required` before setup.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        default:
          $ref: "#/components/responses/Error"
  /admin/logout:
    post:
      operationId: adminLogout
      summary: End this administrator session
      parameters:
        - $ref: "#/components/parameters/AdminToken"
      responses:
        "204":
          description: Signed out
        default:
          $ref: "#/components/responses/Error"
  /admin/password:
    post:
      operationId: changeAdminPassword
      summary: Set a new administrator password; other admin sessions end
      parameters:
        - $ref: "#/components/parameters/AdminToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChange"
      responses:
        "204":
          description: Changed
        default:
          $ref: "#/components/responses/Error"
  /admin/settings:
    get:
      operationId: getAdminSettings
      summary: The server settings an administrator can change
      parameters:
        - $ref: "#/components/parameters/AdminToken"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSettings"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: updateAdminSettings
      summary: Change server settings
      description: >-
        Only the settings named in `values` change; an empty string returns
        one to its default. The server checks the result as a whole and
        changes nothing when something is wrong: 400 `invalid_settings` with
        `params.keys`, the settings at fault (unknown, set by the
        environment, or invalid).
      parameters:
        - $ref: "#/components/parameters/AdminToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSettingsInput"
      responses:
        "200":
          description: Saved; the settings now in force
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSettings"
        default:
          $ref: "#/components/responses/Error"
  /admin/users:
    get:
      operationId: listAdminUsers
      summary: The server's accounts, newest first, at most 200
      parameters:
        - $ref: "#/components/parameters/AdminToken"
        - name: q
          in: query
          description: Only accounts whose name, email address or username contains this.
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserList"
        default:
          $ref: "#/components/responses/Error"
  /admin/users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: deleteAdminUser
      summary: Delete an account, as /me/delete does
      parameters:
        - $ref: "#/components/parameters/AdminToken"
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Error"
  /admin/users/{userId}/entitlements:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listAdminEntitlements
      summary: Everything the account has been given, newest first
      parameters:
        - $ref: "#/components/parameters/AdminToken"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntitlementList"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: grantAdminEntitlement
      summary: Give the account a plan, for some days or for good
      parameters:
        - $ref: "#/components/parameters/AdminToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntitlementGrant"
      responses:
        "201":
          description: Granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entitlement"
        default:
          $ref: "#/components/responses/Error"
  /admin/entitlements/{entitlementId}:
    parameters:
      - name: entitlementId
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: revokeAdminEntitlement
      summary: End an entitlement now, after a refund for example
      parameters:
        - $ref: "#/components/parameters/AdminToken"
      responses:
        "204":
          description: Revoked
        default:
          $ref: "#/components/responses/Error"
  /admin/plans:
    get:
      operationId: getAdminPlans
      summary: The plans and what buys them
      parameters:
        - $ref: "#/components/parameters/AdminToken"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanCatalog"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: updateAdminPlans
      summary: Replace the plans and what buys them, all or nothing
      description: >-
        Plans left out are deleted, which `plan_in_use` refuses for one that
        an entitlement or a product still names. Exactly one plan must be the
        default.
      parameters:
        - $ref: "#/components/parameters/AdminToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanCatalog"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanCatalog"
        default:
          $ref: "#/components/responses/Error"
  /admin/payments:
    get:
      operationId: listAdminPayments
      summary: The payments providers reported, newest first, at most 200
      parameters:
        - $ref: "#/components/parameters/AdminToken"
        - name: state
          in: query
          description: Only payments in this state.
          schema:
            $ref: "#/components/schemas/PaymentState"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentList"
        default:
          $ref: "#/components/responses/Error"
  /admin/payments/{paymentId}/assign:
    parameters:
      - name: paymentId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: assignAdminPayment
      summary: Give a payment that found no account to one
      description: >-
        The payment's address reaches that account from now on, so that the
        next payment needs no one's help. A payment that bought nothing
        configured needs `planId` and `days`.
      parameters:
        - $ref: "#/components/parameters/AdminToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentAssign"
      responses:
        "200":
          description: Assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        default:
          $ref: "#/components/responses/Error"
  /me/plan:
    get:
      operationId: getMyPlan
      summary: The account's plan and how much of it is used
      description: Takes in payments made with its confirmed addresses first.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyPlan"
        default:
          $ref: "#/components/responses/Error"
  /me/play/purchases:
    post:
      operationId: reportPlayPurchase
      summary: Tell the server of a Google Play subscription
      description: |
        The server asks Google about the token rather than taking the app's
        word for anything. Reporting a purchase again changes nothing, and
        brings in a renewal the server hasn't heard of. `invalid_purchase` is
        a token Google doesn't know, `play_other_account` a purchase of
        another account, and `play_unavailable` means Google couldn't be
        asked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayPurchaseRequest"
      responses:
        "200":
          description: The account's plan now
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyPlan"
        default:
          $ref: "#/components/responses/Error"
  /me/payments/claim:
    post:
      operationId: claimPayment
      summary: Take a Ko-fi payment by its transaction ID
      description: |
        For a payment that came without the account's payment code. Claiming
        one's own payment again changes nothing. `payment_not_found` is an ID
        the server hasn't heard of, `payment_applied` a payment of another
        account, and `payment_no_plan` a payment nothing on sale matches, which
        is left for the administrator.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentClaim"
      responses:
        "200":
          description: Claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyPlan"
        default:
          $ref: "#/components/responses/Error"
  /groups:
    post:
      operationId: createGroup
      summary: Create a group with its first members
      description: >-
        The response carries the secret token. In accounts mode the creator
        must be signed in and becomes the first member.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        default:
          $ref: "#/components/responses/Error"
  /groups/import:
    post:
      operationId: importGroup
      summary: Create a group from another app's export
      description: >-
        Reads a Settle Up CSV export and creates a group with its people,
        expenses and transfers, all in one go: if any row cannot be imported,
        nothing is. With `dryRun` nothing is stored and the response is a
        preview; it still counts against the client's allowance of new
        groups. Amounts in other currencies use the export's converted
        amounts, so the group has one currency. In accounts mode the creator
        must be signed in and say which person in the file they are (`me`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportInput"
      responses:
        "200":
          description: The preview, for `dryRun`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportPreview"
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        default:
          description: >-
            `import_file` (params.problem: `encoding`, `header`, `empty`,
            `too_many_rows`, `currency`) when the file is not a usable export;
            `import_row` (params.line, params.problem) for a row that cannot
            be imported; `import_me` when `me` is not a person in the file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /groups/summaries:
    post:
      operationId: getGroupSummaries
      summary: Home screen cards for the groups a device knows
      description: >-
        Tokens the server does not know (deleted, or the link was reset) are
        listed in `missing` so the app can forget them. Groups that are there
        but not open to this caller (it must sign in, or is not a member) are
        listed in `locked`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupSummaryRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupSummaryList"
        default:
          $ref: "#/components/responses/Error"
  /auth/register:
    post:
      operationId: register
      summary: Create an account with a password (accounts mode)
      description: >-
        Refused with 403 `signup_closed` when BALNANA_AUTH_SIGNUP is closed,
        or invite_only and there is no invitation for the address. The first
        account on a server can always be created. 409 `email_taken` or
        `username_taken` when another account has it; 400 `invalid_username`.
        With an invitation sent to the address, an account that never
        confirmed it is taken back instead, as a password reset would.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Error"
  /auth/login:
    post:
      operationId: login
      summary: Sign in with email and password (accounts mode)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Error"
  /auth/logout:
    post:
      operationId: logout
      summary: End this session
      responses:
        "204":
          description: Signed out
        default:
          $ref: "#/components/responses/Error"
  /auth/verify-email:
    post:
      operationId: verifyEmail
      summary: Confirm an email address with the token from a verification email
      description: >-
        A token sent to a pending address makes it the account's address. 409
        `email_taken` when another account has taken that address meanwhile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailToken"
      responses:
        "204":
          description: Verified
        default:
          $ref: "#/components/responses/Error"
  /auth/password-reset:
    post:
      operationId: requestPasswordReset
      summary: Email a password reset link
      description: >-
        Answers the same whether or not an account has the address, so it
        cannot be used to find out who has an account. 403 `email_off` when
        the server has no email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "204":
          description: Sent, if the address has an account
        default:
          $ref: "#/components/responses/Error"
  /auth/password-reset/confirm:
    post:
      operationId: resetPassword
      summary: Set a new password with the token from a reset email
      description: Every session of the account is signed out.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordReset"
      responses:
        "204":
          description: Changed
        default:
          $ref: "#/components/responses/Error"
  /auth/oauth/{provider}/start:
    parameters:
      - $ref: "#/components/parameters/OAuthProviderId"
    get:
      operationId: startOAuth
      summary: Leave for the provider's sign-in page (opened in a browser)
      description: >-
        The app opens this in the browser rather than calling it. It comes
        back through the callback to `/oauth-done` in the web app (on `origin`
        when given), or to `balnana://app/oauth-done` in the Android app, with
        `next` and one of `code` (Android, or a web app on another origin:
        trade it with /auth/oauth/exchange), `pending` (ask whether an
        unverified account is theirs: /auth/oauth/pending), `linked` (with
        `link`: the identity was added; with a `code` too, it is added when
        the code is traded) or `error`.
      parameters:
        - name: app
          in: query
          required: true
          schema:
            type: string
            enum: [web, android]
        - name: next
          in: query
          description: App path to open afterwards, such as `/groups`.
          schema:
            type: string
        - name: challenge
          in: query
          description: >-
            Android, or with `origin`: base64url SHA-256 of a random verifier
            the app keeps, sent again with the code to /auth/oauth/exchange.
          schema:
            type: string
        - name: origin
          in: query
          description: >-
            A web app on another origin than this server's, such as
            `https://app.example`: it must be listed by name in
            BALNANA_CORS_ORIGINS (`*` is not enough), or the answer is
            `invalid_origin`. The sign-in comes back to it as a code.
          schema:
            type: string
        - name: link
          in: query
          description: >-
            A ticket from POST /me/oauth/{provider}: the identity is added to
            that account instead of signing in. Without `challenge` the
            browser must be signed in to that account with its cookie. Comes
            back with `error` `invalid_token` when it is spent or old.
          schema:
            type: string
      responses:
        "302":
          description: To the provider
          headers:
            Location:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /auth/oauth/{provider}/callback:
    parameters:
      - $ref: "#/components/parameters/OAuthProviderId"
    get:
      operationId: oauthCallback
      summary: Where the provider sends the browser back
      description: >-
        Signs in to the account with this provider identity. Otherwise, when
        the provider's address is trusted (its TRUST_EMAIL setting) and
        verified, an account with that address that verified it gets the
        identity added. One that never verified it is reclaimed by the
        address owner when BALNANA_AUTH_REQUIRE_VERIFIED is on: its password,
        previous sessions, emailed tokens and other OAuth identities are
        removed. When it is off, the person is asked instead (`pending`). An
        address the provider is not trusted with that belongs to an account
        is `email_has_account`: sign in to it and link the provider there.
        Failing a match, a new account is made when sign-up allows it, with
        an untrusted address unverified. Identities are scoped to provider,
        issuer and subject. Errors include `oauth_failed`, `oauth_cancelled`,
        `signup_closed`, `email_has_account`, and when linking
        `identity_taken` and `invalid_token`.
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
        - name: balnana_oauth
          in: cookie
          schema:
            type: string
      responses:
        "302":
          description: Back to the app
          headers:
            Location:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /auth/oauth/exchange:
    post:
      operationId: exchangeOAuthCode
      summary: Trade an Android or cross-origin web sign-in code for a session
      description: >-
        A code that came back with `linked` adds the identity to its account
        instead, and the answer has no `token`: the app keeps its session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthExchange"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Error"
  /auth/oauth/pending:
    post:
      operationId: getOAuthPending
      summary: The sign-in waiting for its person to say whose account it is
      description: >-
        400 `invalid_token` when the token is spent or old: sign in again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthPendingToken"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthPending"
        default:
          $ref: "#/components/responses/Error"
  /auth/oauth/pending/finish:
    post:
      operationId: finishOAuthPending
      summary: Answer whose the unverified account is, and sign in
      description: >-
        `link`: it is theirs, proven by its password (403 `wrong_password`);
        the identity is added, the password kept and the address verified.
        `take_over`: it is theirs, password forgotten; everything else that
        signs in to it is removed, as when an address owner reclaims an
        account. `new_account`: it is not theirs; a new account gets the
        address, and the old one keeps going without it (`signup_closed`
        when sign-up does not allow it). A sign-in started with a challenge
        sends its verifier; one without is answered from the browser that
        started it. 400 `invalid_token` when the token is spent or old, or
        the account changed meanwhile.
      parameters:
        - name: balnana_oauth
          in: cookie
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthPendingFinish"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Error"
  /auth/invites/{inviteToken}:
    parameters:
      - name: inviteToken
        in: path
        required: true
        description: The secret from an invitation email.
        schema:
          type: string
    get:
      operationId: getInvite
      summary: The invitation behind an invitation link
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteInfo"
        default:
          $ref: "#/components/responses/Error"
  /me:
    get:
      operationId: getMe
      summary: The signed-in account
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
  /me/password:
    post:
      operationId: changePassword
      summary: Set a new password; other sessions are signed out
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChange"
      responses:
        "204":
          description: Changed
        default:
          $ref: "#/components/responses/Error"
  /me/email:
    post:
      operationId: changeEmail
      summary: Set, change or remove the account's email address
      description: >-
        When the server can send email, a new address is kept as
        `pendingEmail` and a verification link is emailed to it; it replaces
        the current address only once that link is opened, so a mistyped
        address never takes its place. Giving the current address again drops
        a pending one. Without email, the new address replaces the current one
        at once, unverified. An empty address removes it, only from an account
        that signs in with a username (400 `email_needed`). 409 `email_taken`
        when another account has it; 429 `rate_limited` when the account has
        changed its address too often.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailChange"
      responses:
        "200":
          description: Changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
  /me/delete:
    post:
      operationId: deleteMe
      summary: Delete the signed-in account
      description: >-
        Sessions, sign-in methods and email links go with it. In its groups
        the account's member stays, unclaimed, so balances and history still
        add up; ownership passes to the longest-standing other account. Groups
        no other account can reach afterwards (no other account member, and
        not open by link) are deleted. 403 `wrong_password` when the account
        has a password and it is not given.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountDelete"
      responses:
        "204":
          description: Deleted; the session has ended
        default:
          $ref: "#/components/responses/Error"
  /me/verify-email:
    post:
      operationId: sendVerifyEmail
      summary: Email a new verification link to the account's address
      description: >-
        Sent to the pending address when there is one, else to the current
        address while it is unverified.
      responses:
        "204":
          description: Sent, or already verified
        default:
          $ref: "#/components/responses/Error"
  /me/oauth:
    get:
      operationId: getMyOAuth
      summary: The providers the account signs in with
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthLinks"
        default:
          $ref: "#/components/responses/Error"
  /me/oauth/{provider}:
    parameters:
      - $ref: "#/components/parameters/OAuthProviderId"
    post:
      operationId: linkOAuth
      summary: Start adding a provider to the account
      description: >-
        Returns a ticket for /auth/oauth/{provider}/start's `link`, good for a
        few minutes. 403 `wrong_password` when the account has a password and
        it is not given.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthLinkInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthLinkTicket"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: unlinkOAuth
      summary: Stop signing in with a provider
      description: >-
        409 `last_sign_in_method` when the account would have no way in left.
      responses:
        "204":
          description: Removed
        default:
          $ref: "#/components/responses/Error"
  /me/groups:
    get:
      operationId: getMyGroups
      summary: Home screen cards for the groups the account is a member of
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupSummaryList"
        default:
          $ref: "#/components/responses/Error"
  /push/devices/{device}:
    parameters:
      - name: device
        in: path
        required: true
        description: >-
          An ID the app makes up for this install and keeps. Whoever knows it
          can change what the device hears about, so it is a secret.
        schema:
          type: string
          minLength: 16
          maxLength: 128
    put:
      operationId: registerPushDevice
      summary: Send this device notifications about the groups it follows
      description: >-
        Replaces what the device was told about before. A signed-in device is
        also told about the account's groups, until the session ends. Groups
        the link alone does not open, unknown tokens and members not in the
        group are left out without an error. Only when `push` is on in
        /server-info; otherwise `push_off`. A subscription the server cannot
        send to (keys that are not sound, an endpoint that is not an https URL
        on a public address) is `invalid_subscription`. A client registering
        too many new devices gets `rate_limited`; a group followed by 200
        devices leaves new ones out.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushDeviceInput"
      responses:
        "204":
          description: Registered
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: removePushDevice
      summary: Stop sending this device notifications
      responses:
        "204":
          description: Removed, or was never registered
        default:
          $ref: "#/components/responses/Error"
  /g/{token}:
    parameters:
      - $ref: "#/components/parameters/Token"
    get:
      operationId: getGroup
      summary: The group, its members and their balances
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateGroup
      parameters:
        - $ref: "#/components/parameters/ActingMember"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteGroup
      summary: Delete the group with everything in it
      description: >-
        Accounts mode: the owner only (403 `owner_only`), or any account
        member when the group has no owner left, or anyone the link opens it
        for when no account is a member any more. Link mode: anyone with the
        link. The group is gone for everyone at once; the server keeps it
        archived for 30 days, when an operator with database access can still
        restore it by clearing archived_at (there is no restore API or UI),
        then deletes it for good.
      parameters:
        - $ref: "#/components/parameters/ActingMember"
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Error"
  /g/{token}/reset-link:
    parameters:
      - $ref: "#/components/parameters/Token"
    post:
      operationId: resetGroupLink
      summary: Replace the token; the old link stops working
      description: Accounts mode, members only (403 `not_a_member`).
      parameters:
        - $ref: "#/components/parameters/ActingMember"
      responses:
        "200":
          description: The group under its new token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        default:
          $ref: "#/components/responses/Error"
  /g/{token}/join:
    parameters:
      - $ref: "#/components/parameters/Token"
    get:
      operationId: getJoinInfo
      summary: What a signed-in person needs to decide to join (accounts mode)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinInfo"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: joinGroup
      summary: Become a member, as a new member or by claiming a placeholder
      description: >-
        Joining again after leaving brings the old member back. Joining when
        already a member changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinInput"
      responses:
        "200":
          description: The group, now with you in it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        default:
          $ref: "#/components/responses/Error"
  /g/{token}/invites:
    parameters:
      - $ref: "#/components/parameters/Token"
    post:
      operationId: inviteToGroup
      summary: Email someone an invitation to the group (accounts mode)
      description: >-
        Optionally for one unclaimed member, whom the invited person is
        offered to join as. The invitation also lets them register on an
        invite_only server. Only an account with a confirmed address sends
        invitations (otherwise 403 `email_unverified`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteInput"
      responses:
        "204":
          description: Sent
        default:
          $ref: "#/components/responses/Error"
  /g/{token}/plan:
    parameters:
      - $ref: "#/components/parameters/Token"
    get:
      operationId: getGroupPlan
      summary: The limits that apply to the group and how much of them is used
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupPlan"
        default:
          $ref: "#/components/responses/Error"
  /g/{token}/sponsor:
    parameters:
      - $ref: "#/components/parameters/Token"
    put:
      operationId: sponsorGroup
      summary: Share the signed-in account's plan with the whole group
      description: >-
        `already_sponsored` while another member's plan covers it, and
        `plan_limit` when the account sponsors all that its plan allows.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupPlan"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: unsponsorGroup
      summary: Stop sponsoring the group; only its sponsor may
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupPlan"
        default:
          $ref: "#/components/responses/Error"
  /g/{token}/members:
    parameters:
      - $ref: "#/components/parameters/Token"
    post:
      operationId: addMember
      parameters:
        - $ref: "#/components/parameters/ActingMember"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        default:
          $ref: "#/components/responses/Error"
  /g/{token}/members/{memberId}:
    parameters:
      - $ref: "#/components/parameters/Token"
      - $ref: "#/components/parameters/MemberId"
    patch:
      operationId: updateMember
      parameters:
        - $ref: "#/components/parameters/ActingMember"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: removeMember
      summary: Mark a member as having left
      description: >-
        Only members whose balance is zero can leave. They stay in past
        expenses; error `member_has_balance` otherwise.
      parameters:
        - $ref: "#/components/parameters/ActingMember"
      responses:
        "204":
          description: Removed
        default:
          $ref: "#/components/responses/Error"
  /g/{token}/categories:
    parameters:
      - $ref: "#/components/parameters/Token"
    post:
      operationId: addCategory
      summary: Add a category of the group's own
      description: At most 50 per group; error `too_many_categories` otherwise.
      parameters:
        - $ref: "#/components/parameters/ActingMember"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        default:
          $ref: "#/components/responses/Error"
  /g/{token}/categories/{categoryId}:
    parameters:
      - $ref: "#/components/parameters/Token"
      - $ref: "#/components/parameters/CategoryId"
    patch:
      operationId: updateCategory
      summary: Change a category, or hide or show it in this group
      description: >-
        Built-in categories can only be hidden or shown; error
        `builtin_category` for other changes.
      parameters:
        - $ref: "#/components/parameters/ActingMember"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteCategory
      summary: Delete one of the group's own categories
      description: >-
        Its expenses are left without a category. Deleting a built-in category
        returns 400 `builtin_category` without changing it; use PATCH with
        `hidden: true` to hide it instead.
      parameters:
        - $ref: "#/components/parameters/ActingMember"
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Error"
  /g/{token}/expenses:
    parameters:
      - $ref: "#/components/parameters/Token"
    get:
      operationId: listExpenses
      summary: Expenses and payments, newest first
      description: >-
        The filters combine; a cursor only works with the filters it was
        given with.
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: q
          in: query
          description: Text to find in the title, note or location, ignoring case.
          schema:
            type: string
            maxLength: 100
        - name: member
          in: query
          description: Only what this member paid or has a share in.
          schema:
            type: string
        - name: category
          in: query
          description: Only expenses of this category.
          schema:
            type: string
        - name: kind
          in: query
          schema:
            type: string
            enum: [expense, payment]
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpensePage"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createExpense
      description: >-
        Every payer and split member must be in the group and not have left
        it (400 `unknown_member` or `member_left`).
      parameters:
        - $ref: "#/components/parameters/ActingMember"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        default:
          $ref: "#/components/responses/Error"
  /g/{token}/expenses/{expenseId}:
    parameters:
      - $ref: "#/components/parameters/Token"
      - $ref: "#/components/parameters/ExpenseId"
    get:
      operationId: getExpense
      summary: One expense, also when deleted
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: updateExpense
      description: >-
        `version` must be the version that was read; otherwise the expense
        changed meanwhile and the answer is 409 `expense_version_conflict`.
        A member who left may stay in an expense they were already part of,
        but not be added to one, nor have what they paid or their share
        change (400 `member_left`).
      parameters:
        - $ref: "#/components/parameters/ActingMember"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteExpense
      summary: Delete (restorable)
      description: >-
        409 `member_left` when someone in the expense has left the group and
        deleting it would change their balance.
      parameters:
        - $ref: "#/components/parameters/ActingMember"
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Error"
  /g/{token}/expenses/{expenseId}/receipt:
    parameters:
      - $ref: "#/components/parameters/Token"
      - $ref: "#/components/parameters/ExpenseId"
    get:
      operationId: getReceipt
      summary: The photo of the expense's receipt
      responses:
        "200":
          description: A JPEG image
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: putReceipt
      summary: Attach a photo of the receipt, replacing any earlier one
      description: >-
        JPEG, PNG or WebP up to 10 MiB, 16 million pixels, and 16,384 pixels
        per side. The server stores it as a JPEG of at
        most 2048 pixels a side, turned upright and without metadata such as
        where it was taken. The expense's version does not change.
        Uploads are processed one at a time; once its turn comes, the photo
        must arrive within two minutes, or the answer is 408 `timeout`.
      parameters:
        - $ref: "#/components/parameters/ActingMember"
      requestBody:
        required: true
        content:
          image/*:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: The expense, now with `hasReceipt`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteReceipt
      summary: Remove the photo of the receipt
      parameters:
        - $ref: "#/components/parameters/ActingMember"
      responses:
        "204":
          description: Removed, or there was none
        default:
          $ref: "#/components/responses/Error"
  /g/{token}/expenses/{expenseId}/restore:
    parameters:
      - $ref: "#/components/parameters/Token"
      - $ref: "#/components/parameters/ExpenseId"
    post:
      operationId: restoreExpense
      summary: Undo a delete
      description: >-
        409 `member_left` when someone in the expense has left the group
        since, as restoring it would give them a balance again.
      parameters:
        - $ref: "#/components/parameters/ActingMember"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        default:
          $ref: "#/components/responses/Error"
  /g/{token}/payments:
    parameters:
      - $ref: "#/components/parameters/Token"
    post:
      operationId: createPayment
      summary: Record that one member paid another
      description: Both members must not have left the group (400 `member_left`).
      parameters:
        - $ref: "#/components/parameters/ActingMember"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInput"
      responses:
        "201":
          description: The payment, stored as an expense of kind `payment`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        default:
          $ref: "#/components/responses/Error"
  /g/{token}/recurring:
    parameters:
      - $ref: "#/components/parameters/Token"
    get:
      operationId: listRecurringExpenses
      summary: The group's recurring expenses, soonest first
      description: Ended ones, with no `nextAt`, come last.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecurringExpense"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createRecurringExpense
      summary: Make an expense repeat
      description: >-
        The server adds the expense at every occurrence, as made by whoever
        set it up. Occurrences already due, from `startsAt` on, are added
        straight away; 400 `too_many_due` when that would be more than 100.
        Every payer and split member must be in the group and not have left
        it (400 `unknown_member` or `member_left`).
      parameters:
        - $ref: "#/components/parameters/ActingMember"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecurringExpenseInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringExpense"
        default:
          $ref: "#/components/responses/Error"
  /g/{token}/recurring/{recurringId}:
    parameters:
      - $ref: "#/components/parameters/Token"
      - $ref: "#/components/parameters/RecurringId"
    get:
      operationId: getRecurringExpense
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringExpense"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: updateRecurringExpense
      description: >-
        Changes what later occurrences add; expenses already added stay as
        they are. The new schedule takes over at its occurrence nearest to
        where the old one would have gone next, so moving the day neither
        adds a period twice nor leaves one out; one that has added nothing
        yet starts over. Occurrences skipped while paused stay skipped.
        `version` must be the version that was read;
        otherwise the answer is 409 `recurring_version_conflict`.
      parameters:
        - $ref: "#/components/parameters/ActingMember"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecurringExpenseInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringExpense"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: pauseRecurringExpense
      summary: Pause or resume
      description: >-
        Resuming adds the occurrences that came due before it was paused,
        such as one that could not be added, and skips those that came due
        while it was paused. The server pauses a recurring expense itself
        when an occurrence cannot be added, such as when someone in it has
        left the group. 400 when what it would add no longer works.
      parameters:
        - $ref: "#/components/parameters/ActingMember"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecurringPause"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringExpense"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteRecurringExpense
      summary: Stop repeating
      description: The expenses already added stay.
      parameters:
        - $ref: "#/components/parameters/ActingMember"
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Error"
  /g/{token}/balances:
    parameters:
      - $ref: "#/components/parameters/Token"
    get:
      operationId: getBalances
      summary: Net balances and the payments that settle them
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Balances"
        default:
          $ref: "#/components/responses/Error"
  /g/{token}/stats:
    parameters:
      - $ref: "#/components/parameters/Token"
    get:
      operationId: getStats
      summary: What the group spent, by category, member and month
      description: Payments between members are not spending and are left out.
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/TimeZone"
        - name: utcOffset
          in: query
          description: >-
            Minutes east of UTC that months begin at, when `timeZone` is not
            given. One offset cannot follow daylight saving time.
          schema:
            type: integer
            minimum: -840
            maximum: 840
            default: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupStats"
        default:
          $ref: "#/components/responses/Error"
  /g/{token}/export.csv:
    parameters:
      - $ref: "#/components/parameters/Token"
    get:
      operationId: exportCsv
      summary: Every expense and payment of the group as a spreadsheet
      description: >-
        UTF-8 CSV with a byte order mark, oldest first. Fixed columns, in order:
        Date, Title, Category, Type (`expense`, `payment`, `refund` or `income`),
        Amount, Currency, Note, Location, Latitude, Longitude, Original amount,
        Original currency (what an expense paid in another currency came to in
        it, else empty), then one per member with what the entry did to their balance (paid minus
        share), so each member column adds up to their balance.
      parameters:
        - $ref: "#/components/parameters/TimeZone"
        - name: utcOffset
          in: query
          description: >-
            Minutes east of UTC to write dates in, when `timeZone` is not
            given. One offset cannot follow daylight saving time.
          schema:
            type: integer
            minimum: -840
            maximum: 840
            default: 0
      responses:
        "200":
          description: OK
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"
  /g/{token}/activity:
    parameters:
      - $ref: "#/components/parameters/Token"
    get:
      operationId: listActivity
      summary: What happened in the group, newest first
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityPage"
        default:
          $ref: "#/components/responses/Error"
  /g/{token}/events:
    parameters:
      - $ref: "#/components/parameters/Token"
    get:
      operationId: groupEvents
      summary: Live notices that the group changed (server-sent events)
      description: >-
        A text/event-stream that stays open. It sends a `change` event
        whenever something in the group changes (no data: reload what is
        shown), comments to keep the connection alive, and a `gone` event
        before closing when the request may no longer see the group (link
        reset, removed from it, signed out). Events missed while not connected
        are not replayed, so reload after connecting.
      responses:
        "200":
          description: The event stream
          content:
            text/event-stream:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
components:
  parameters:
    AdminToken:
      name: X-Balnana-Admin
      in: header
      required: false
      description: The token from /admin/login or /admin/setup.
      schema:
        type: string
    Token:
      name: token
      in: path
      required: true
      description: The group's secret token from its link.
      schema:
        type: string
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: string
    MemberId:
      name: memberId
      in: path
      required: true
      schema:
        type: string
    ExpenseId:
      name: expenseId
      in: path
      required: true
      schema:
        type: string
    RecurringId:
      name: recurringId
      in: path
      required: true
      schema:
        type: string
    OAuthProviderId:
      name: provider
      in: path
      required: true
      description: An id from `oauthProviders` in /server-info.
      schema:
        type: string
    From:
      name: from
      in: query
      description: Only what happened at or after this time.
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      description: Only what happened before this time.
      schema:
        type: string
        format: date-time
    TimeZone:
      name: timeZone
      in: query
      required: false
      description: >-
        The reader's IANA time zone, such as `Europe/Berlin`. Each entry is
        dated by the offset in force when it happened. 400
        `invalid_time_zone` for a name the server does not know.
      schema:
        type: string
        maxLength: 64
    ActingMember:
      name: X-Balnana-Member
      in: header
      required: false
      description: >-
        Link mode: the member this device acts as, recorded in the activity
        log. Ignored when it is not a member of the group, and always in
        accounts mode, where only the signed-in account names the actor.
      schema:
        type: string
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
    cookie:
      type: apiKey
      in: cookie
      name: balnana_session
  responses:
    Error:
      description: >-
        An error. 400 for invalid input, 401 when signing in is needed, 403
        when not allowed, 404 for an unknown group or item, 409 for
        conflicts.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Money:
      type: string
      description: Decimal amount with up to the group's `minorDigits` decimals.
      example: "12.50"
    GroupCreate:
      type: object
      required: [name, currency, members]
      properties:
        name:
          type: string
        emoji:
          type: string
        color:
          type: integer
          description: 0xRRGGBB
        currency:
          type: string
          description: ISO 4217 code
          example: EUR
        symbol:
          type: string
          description: Shown before amounts; the currency's own symbol when left out.
        minorDigits:
          type: integer
          minimum: 0
          maximum: 4
          default: 2
        members:
          type: array
          description: >-
            Names of the first members, the creator first. In accounts mode
            the first is the creator's name in this group.
          items:
            type: string
        linkAccess:
          type: boolean
          description: >-
            Accounts mode: let anyone with the link in, as in link mode.
            Ignored unless the server allows it (`linkGroups`).
    ImportInput:
      type: object
      required: [format, file]
      properties:
        format:
          type: string
          enum: [settle_up]
        file:
          type: string
          format: byte
          description: The exported file, base64. UTF-8 and UTF-16 are read.
        name:
          type: string
          description: The new group's name. Required unless `dryRun`.
        me:
          type: string
          description: >-
            Which person in the file the creator is. They become the owner;
            in accounts mode, required, and the member is linked to the
            account.
        untitled:
          type: string
          description: Title for expenses the file has no purpose for.
        dryRun:
          type: boolean
    ImportPreview:
      type: object
      required: [currency, minorDigits, members, expenses, payments, skipped]
      properties:
        currency:
          type: string
        minorDigits:
          type: integer
        members:
          type: array
          description: In the order they first appear in the file.
          items:
            $ref: "#/components/schemas/ImportMember"
        expenses:
          type: integer
        payments:
          type: integer
        skipped:
          type: integer
          description: Rows with a zero amount, which are left out.
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
    ImportMember:
      type: object
      required: [name, balance]
      properties:
        name:
          type: string
        balance:
          $ref: "#/components/schemas/Money"
    GroupUpdate:
      type: object
      properties:
        name:
          type: string
        emoji:
          type: string
          description: Empty string clears it.
        symbol:
          type: string
          description: Empty string goes back to the currency's own symbol.
        color:
          type: integer
        linkAccess:
          type: boolean
          description: >-
            Accounts mode, owners only, when the server allows it
            (`linkGroups`).
    Group:
      type: object
      required: [token, name, currency, minorDigits, createdAt, members, categories, linkAccess]
      properties:
        token:
          type: string
        name:
          type: string
        emoji:
          type: string
        color:
          type: integer
        currency:
          type: string
        symbol:
          type: string
          description: Shown before amounts in place of the currency's own symbol.
        minorDigits:
          type: integer
        createdAt:
          type: string
          format: date-time
        members:
          type: array
          description: Everyone, including members who left, oldest first.
          items:
            $ref: "#/components/schemas/Member"
        categories:
          type: array
          description: The built-in categories, then the group's own, including hidden ones.
          items:
            $ref: "#/components/schemas/Category"
        linkAccess:
          type: boolean
          description: Whether the link alone opens the group (always in link mode).
        myMemberId:
          type: string
          description: 'Accounts mode: the signed-in account''s member, if any.'
    Category:
      type: object
      required: [id, emoji, color, builtIn, hidden]
      properties:
        id:
          type: string
        name:
          type: string
          description: Only for the group's own; the app names built-in ones.
        emoji:
          type: string
        color:
          type: integer
        builtIn:
          type: boolean
        hidden:
          type: boolean
          description: Not offered for new expenses in this group.
    CategoryInput:
      type: object
      required: [name, emoji]
      properties:
        name:
          type: string
        emoji:
          type: string
        color:
          type: integer
    CategoryUpdate:
      type: object
      properties:
        name:
          type: string
        emoji:
          type: string
        color:
          type: integer
        hidden:
          type: boolean
    Member:
      type: object
      required: [id, name, left, balance, owner, claimed]
      properties:
        id:
          type: string
        name:
          type: string
        color:
          type: integer
        left:
          type: boolean
        owner:
          type: boolean
        claimed:
          type: boolean
          description: 'Accounts mode: an account is linked to this member.'
        balance:
          $ref: "#/components/schemas/Money"
    MemberInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        color:
          type: integer
    GroupSummaryRequest:
      type: object
      required: [groups]
      properties:
        groups:
          type: array
          maxItems: 200
          items:
            type: object
            required: [token]
            properties:
              token:
                type: string
              memberId:
                type: string
                description: Who this device is in the group, for `balance`.
    GroupSummaryList:
      type: object
      required: [groups, missing, locked]
      properties:
        groups:
          type: array
          items:
            $ref: "#/components/schemas/GroupSummary"
        missing:
          type: array
          items:
            type: string
        locked:
          type: array
          items:
            type: string
    GroupSummary:
      type: object
      required: [token, name, currency, minorDigits, memberCount, updatedAt]
      properties:
        token:
          type: string
        name:
          type: string
        emoji:
          type: string
        color:
          type: integer
        currency:
          type: string
        symbol:
          type: string
          description: Shown before amounts in place of the currency's own symbol.
        minorDigits:
          type: integer
        memberCount:
          type: integer
        balance:
          $ref: "#/components/schemas/Money"
        updatedAt:
          type: string
          format: date-time
          description: Last activity in the group.
    Share:
      type: object
      required: [memberId]
      properties:
        memberId:
          type: string
        value:
          type: string
          description: >-
            Ignored for `equal`; an amount for `exact`; a weight for
            `shares` (up to 4 decimals).
    PayerInput:
      type: object
      required: [memberId, amount]
      properties:
        memberId:
          type: string
        amount:
          $ref: "#/components/schemas/Money"
    ExpenseInput:
      type: object
      required: [title, amount, occurredAt, payers, splitMethod, splits]
      properties:
        title:
          type: string
        categoryId:
          type: string
        amount:
          $ref: "#/components/schemas/Money"
        occurredAt:
          type: string
          format: date-time
        note:
          type: string
        location:
          $ref: "#/components/schemas/Location"
        payers:
          type: array
          description: >-
            Who paid; the amounts add up to `amount`, or to `foreign.amount`
            when the expense has one.
          items:
            $ref: "#/components/schemas/PayerInput"
        splitMethod:
          $ref: "#/components/schemas/SplitMethod"
        splits:
          type: array
          items:
            $ref: "#/components/schemas/Share"
        foreign:
          $ref: "#/components/schemas/ForeignInput"
        version:
          type: integer
          description: Required when updating.
    ForeignInput:
      type: object
      required: [currency, amount]
      description: >-
        What an expense came to in another currency than the group's. The
        expense's `amount` is then what was paid in the group's currency,
        such as what a card was charged, while payer amounts and `exact`
        split values are in this currency and add up to this `amount`, with
        the currency's usual decimals. The server spreads the group-currency
        amount over the payers and the split in proportion to their amounts
        in this currency, largest remainders first, so every balance stays in
        the group's currency. Errors: `invalid_currency` for a code that is
        not three letters or is the group's own, `invalid_payment` on a
        payment, and `payer_too_small` when a payer's part comes to nothing
        in the group's currency.
      properties:
        currency:
          type: string
          description: ISO 4217 code, such as `JPY`.
        amount:
          type: string
          description: Decimal amount with up to the currency's usual decimals.
          example: "3000"
    Foreign:
      type: object
      required: [currency, minorDigits, amount]
      description: >-
        What the expense came to in the currency it was paid in. The rate is
        this amount against the expense's `amount`.
      properties:
        currency:
          type: string
        minorDigits:
          type: integer
          description: Decimals of `amount` and of the parts' `foreignAmount`.
        amount:
          type: string
          description: Decimal amount with `minorDigits` decimals.
    Location:
      type: object
      description: >-
        Where an expense happened: a name, a point on the map, or both. Error
        `invalid_location` for a name over 200 characters or on several lines,
        or a point off the globe.
      properties:
        name:
          type: string
        point:
          $ref: "#/components/schemas/GeoPoint"
    GeoPoint:
      type: object
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          format: double
          description: Degrees north, -90 to 90 (WGS 84).
        longitude:
          type: number
          format: double
          description: Degrees east, -180 to 180 (WGS 84).
    PaymentInput:
      type: object
      required: [fromMemberId, toMemberId, amount]
      properties:
        fromMemberId:
          type: string
        toMemberId:
          type: string
        amount:
          $ref: "#/components/schemas/Money"
        occurredAt:
          type: string
          format: date-time
          description: Defaults to now.
    SplitMethod:
      type: string
      enum: [equal, exact, shares]
    Expense:
      type: object
      required: [id, kind, title, amount, occurredAt, splitMethod, payers, splits, createdAt, updatedAt, version, hasReceipt, transactionType]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [expense, payment]
        transactionType:
          type: string
          enum: [expense, refund, income]
          description: |
            Imported transaction direction. Refunds offset spending; income is
            excluded from spending. Incoming entries retain reversed payer/split
            rows for balances. Preserved when editing an imported entry.
        title:
          type: string
        categoryId:
          type: string
        amount:
          $ref: "#/components/schemas/Money"
        occurredAt:
          type: string
          format: date-time
        note:
          type: string
        location:
          $ref: "#/components/schemas/Location"
        splitMethod:
          $ref: "#/components/schemas/SplitMethod"
        payers:
          type: array
          items:
            $ref: "#/components/schemas/Payer"
        splits:
          type: array
          items:
            $ref: "#/components/schemas/SplitPart"
        createdBy:
          type: string
          description: Member id of whoever added it, when known.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
        version:
          type: integer
        hasReceipt:
          type: boolean
          description: Whether a photo of the receipt is attached (`/receipt`).
        recurringId:
          type: string
          description: The recurring expense that added it, while that still exists.
        foreign:
          $ref: "#/components/schemas/Foreign"
    Repeat:
      type: object
      required: [unit, every]
      properties:
        unit:
          type: string
          enum: [day, week, month, year]
        every:
          type: integer
          minimum: 1
          maximum: 999
          description: >-
            How many units apart occurrences are. A month or year from the
            31st falls on the last day of shorter months.
    RecurringExpenseInput:
      type: object
      required: [title, amount, payers, splitMethod, splits, repeat, startsAt]
      properties:
        title:
          type: string
        categoryId:
          type: string
        amount:
          $ref: "#/components/schemas/Money"
        note:
          type: string
        location:
          $ref: "#/components/schemas/Location"
        payers:
          type: array
          items:
            $ref: "#/components/schemas/PayerInput"
        splitMethod:
          $ref: "#/components/schemas/SplitMethod"
        splits:
          type: array
          items:
            $ref: "#/components/schemas/Share"
        repeat:
          $ref: "#/components/schemas/Repeat"
        startsAt:
          type: string
          format: date-time
          description: The first occurrence.
        endsOn:
          type: string
          description: >-
            The last day an occurrence may fall on, as YYYY-MM-DD in
            `timeZone`; none to repeat until stopped. 400 `invalid_end`
            when malformed or before `startsAt`.
        timeZone:
          type: string
          maxLength: 64
          description: >-
            The IANA time zone whose calendar the schedule follows, such as
            `Europe/Berlin`, or a fixed offset such as `UTC+05:30` for a
            device that knows only its offset; UTC when left out. 400
            `invalid_time_zone` for a name the server does not know.
        version:
          type: integer
          description: Required when updating.
    RecurringPause:
      type: object
      required: [paused]
      properties:
        paused:
          type: boolean
    RecurringExpense:
      type: object
      required: [id, title, amount, splitMethod, payers, splits, repeat, startsAt, timeZone, paused, createdAt, updatedAt, version]
      properties:
        id:
          type: string
        title:
          type: string
        categoryId:
          type: string
        amount:
          $ref: "#/components/schemas/Money"
        note:
          type: string
        location:
          $ref: "#/components/schemas/Location"
        splitMethod:
          $ref: "#/components/schemas/SplitMethod"
        payers:
          type: array
          items:
            $ref: "#/components/schemas/Payer"
        splits:
          type: array
          items:
            $ref: "#/components/schemas/SplitPart"
        repeat:
          $ref: "#/components/schemas/Repeat"
        startsAt:
          type: string
          format: date-time
        endsOn:
          type: string
          description: YYYY-MM-DD.
        timeZone:
          type: string
        nextAt:
          type: string
          format: date-time
          description: When the next occurrence is added; none once it has ended.
        lastAt:
          type: string
          format: date-time
          description: The latest occurrence added.
        paused:
          type: boolean
        createdBy:
          type: string
          description: Member id of whoever set it up; its expenses are added as theirs.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
    Payer:
      type: object
      required: [memberId, amount]
      properties:
        memberId:
          type: string
        amount:
          $ref: "#/components/schemas/Money"
        foreignAmount:
          type: string
          description: What they paid in the expense's `foreign` currency.
    SplitPart:
      type: object
      required: [memberId, amount]
      properties:
        memberId:
          type: string
        amount:
          $ref: "#/components/schemas/Money"
        share:
          type: string
          description: The weight entered, for `shares`.
        foreignAmount:
          type: string
          description: Their share in the expense's `foreign` currency.
    ExpensePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Expense"
        nextCursor:
          type: string
    Balances:
      type: object
      required: [balances, transfers]
      properties:
        balances:
          type: array
          items:
            $ref: "#/components/schemas/MemberBalance"
        transfers:
          type: array
          description: Suggested payments that settle everyone up.
          items:
            $ref: "#/components/schemas/Transfer"
    GroupStats:
      description: |
        Net spending: expenses minus refunds, excluding payments and income.
        Refund paid/share figures negate the original receiver/beneficiary amounts.
        Date filters apply independently to each entry, including refunds.
      type: object
      required: [total, count, categories, members, months]
      properties:
        total:
          $ref: "#/components/schemas/Money"
        count:
          type: integer
          description: Number of expenses and refunds included; income is excluded.
        categories:
          type: array
          description: Largest first.
          items:
            $ref: "#/components/schemas/CategoryStats"
        members:
          type: array
          description: Every member who paid or had a share, in the group's member order.
          items:
            $ref: "#/components/schemas/MemberStats"
        months:
          type: array
          description: Oldest first, only months with spending.
          items:
            $ref: "#/components/schemas/MonthStats"
    CategoryStats:
      type: object
      required: [amount, count]
      properties:
        categoryId:
          type: string
          description: Absent for expenses without a category.
        amount:
          $ref: "#/components/schemas/Money"
        count:
          type: integer
    MemberStats:
      type: object
      required: [memberId, paid, share]
      properties:
        memberId:
          type: string
        paid:
          $ref: "#/components/schemas/Money"
        share:
          $ref: "#/components/schemas/Money"
          description: What the member's part of the expenses came to.
    MonthStats:
      type: object
      required: [month, amount]
      properties:
        month:
          type: string
          description: Year and month, as 2026-10.
        amount:
          $ref: "#/components/schemas/Money"
    MemberBalance:
      type: object
      required: [memberId, amount]
      properties:
        memberId:
          type: string
        amount:
          $ref: "#/components/schemas/Money"
    Transfer:
      type: object
      required: [fromMemberId, toMemberId, amount]
      properties:
        fromMemberId:
          type: string
        toMemberId:
          type: string
        amount:
          $ref: "#/components/schemas/Money"
    ActivityPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Activity"
        nextCursor:
          type: string
    Activity:
      type: object
      required: [id, action, payload, createdAt]
      properties:
        id:
          type: string
        action:
          type: string
          description: >-
            group.created, group.imported, group.updated, group.link_reset,
            member.added, member.updated, member.removed, member.joined,
            category.added, category.updated, category.deleted,
            expense.created, expense.updated, expense.deleted,
            expense.restored, receipt.added, receipt.removed,
            recurring.created, recurring.updated, recurring.paused,
            recurring.resumed, recurring.deleted. Payments use the expense
            actions with `kind: payment` in the payload. An expense a
            recurring expense added has `recurring: true` in its payload; a
            recurring expense the server paused has no actor and the error
            code as `reason`.
        actorMemberId:
          type: string
        subjectId:
          type: string
        payload:
          type: object
          additionalProperties: true
          description: Names and amounts at the time, for rendering in any language.
        createdAt:
          type: string
          format: date-time
    RegisterInput:
      type: object
      required: [password, name]
      properties:
        email:
          type: string
          description: Required unless the server's emailRequired is false.
        username:
          type: string
          description: >-
            Required when the server's emailRequired is false, and ignored
            otherwise. 3 to 32 of a-z, 0-9, ".", "_" and "-", starting with a
            letter or digit; stored in lower case.
        password:
          type: string
          description: 8 to 200 characters.
        name:
          type: string
        locale:
          type: string
        cookie:
          type: boolean
          description: >-
            The web app served by this server: keep the session in a cookie
            instead of returning a token. A web app on another origin cannot
            (the answer is bad_origin) and keeps the token.
        invite:
          type: string
          description: >-
            The secret from an invitation email for this address. It lets the
            account in on an invite_only server and verifies the address.
    LoginInput:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
          description: The account's email address or username.
        password:
          type: string
        cookie:
          type: boolean
          description: >-
            The web app served by this server: keep the session in a cookie
            instead of returning a token. A web app on another origin cannot
            (the answer is bad_origin) and keeps the token.
    Session:
      type: object
      required: [user]
      properties:
        token:
          type: string
          description: 'Send as `Authorization: Bearer <token>`. Absent with `cookie: true`.'
        user:
          $ref: "#/components/schemas/User"
    User:
      type: object
      required: [id, name, emailVerified, hasPassword]
      properties:
        id:
          type: string
        email:
          type: string
        username:
          type: string
          description: Set on accounts made without an email address.
        emailVerified:
          type: boolean
        pendingEmail:
          type: string
          description: >-
            A new address waiting for its verification link to be opened; the
            account keeps `email` until then.
        name:
          type: string
        locale:
          type: string
        hasPassword:
          type: boolean
    UserUpdate:
      type: object
      properties:
        name:
          type: string
        locale:
          type: string
          description: Empty string follows the device.
    PasswordChange:
      type: object
      required: [newPassword]
      properties:
        currentPassword:
          type: string
          description: Required when the account has a password.
        newPassword:
          type: string
    EmailChange:
      type: object
      required: [email]
      properties:
        email:
          type: string
          description: The new address, or empty to remove it.
        password:
          type: string
          description: Required when the account has a password (403 `wrong_password`).
    AccountDelete:
      type: object
      properties:
        password:
          type: string
          description: Required when the account has a password.
    OAuthPendingToken:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: The `pending` the sign-in came back with.
    OAuthPending:
      type: object
      required: [email, provider, hasPassword, signup]
      properties:
        email:
          type: string
        provider:
          type: string
          description: The provider's id.
        hasPassword:
          type: boolean
          description: The account has a password, so `link` can prove it is theirs.
        signup:
          type: boolean
          description: A new account may be made (`new_account`).
    OAuthPendingFinish:
      type: object
      required: [token, choice]
      properties:
        token:
          type: string
        choice:
          type: string
          enum: [link, take_over, new_account]
        password:
          type: string
          description: The account's password, for `link`.
        verifier:
          type: string
          description: The PKCE verifier, when the sign-in started with a challenge.
        cookie:
          type: boolean
          description: Hand the session out as a cookie, as login does.
    OAuthLinks:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          description: Ids of the providers the account signs in with.
          items:
            type: string
    OAuthLinkInput:
      type: object
      properties:
        password:
          type: string
          description: Required when the account has a password (403 `wrong_password`).
    OAuthLinkTicket:
      type: object
      required: [ticket]
      properties:
        ticket:
          type: string
    OAuthExchange:
      type: object
      required: [code, verifier]
      properties:
        code:
          type: string
        verifier:
          type: string
    EmailToken:
      type: object
      required: [token]
      properties:
        token:
          type: string
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
    PasswordReset:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
        newPassword:
          type: string
    InviteInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
        memberId:
          type: string
          description: An unclaimed member the person is invited to join as.
    InviteInfo:
      type: object
      required: [email, groupToken, groupName]
      properties:
        email:
          type: string
        groupToken:
          type: string
        groupName:
          type: string
        invitedBy:
          type: string
          description: The name of the member who sent the invitation.
    JoinInfo:
      type: object
      required: [name, currency, members, member]
      properties:
        name:
          type: string
        emoji:
          type: string
        color:
          type: integer
        currency:
          type: string
        member:
          type: boolean
          description: The account is already a member.
        members:
          type: array
          description: Current members; unclaimed ones can be claimed.
          items:
            $ref: "#/components/schemas/JoinMember"
        invitedMemberId:
          type: string
          description: The unclaimed member the account was invited to join as.
    JoinMember:
      type: object
      required: [id, name, claimed]
      properties:
        id:
          type: string
        name:
          type: string
        color:
          type: integer
        claimed:
          type: boolean
    JoinInput:
      type: object
      properties:
        claimMemberId:
          type: string
          description: An unclaimed member to become.
        name:
          type: string
          description: Name for a new member; defaults to the account name.
    ServerInfo:
      type: object
      required: [name, version, authMode, password, signup, firstAccount, email, emailRequired, verifiedRequired, oauthProviders, linkGroups, push, publicUrl, sourceUrl, setupRequired, setupCode]
      properties:
        name:
          type: string
          description: Always "balnana"; lets the app recognise a Balnana server.
          example: balnana
        billing:
          $ref: "#/components/schemas/ServerBilling"
        version:
          type: string
          example: 0.1.0
        authMode:
          type: string
          enum: [link, accounts]
        password:
          type: boolean
          description: Email + password sign-in is available (accounts mode only).
        signup:
          type: string
          enum: [open, invite_only, closed]
        firstAccount:
          type: boolean
          description: >-
            No account exists yet, so the first one may sign up with a password
            even though signup is not open. Only ever true then.
        email:
          type: boolean
          description: The server can send email (verification, reset, invites).
        emailRequired:
          type: boolean
          description: >-
            Password accounts sign up with an email address. When false they
            sign up with a username instead, and the address is optional.
        verifiedRequired:
          type: boolean
          description: >-
            An account with an unconfirmed address can do nothing but confirm
            it, change it, or sign out (403 `email_unverified`).
        oauthProviders:
          type: array
          items:
            $ref: "#/components/schemas/OAuthProvider"
        linkGroups:
          type: boolean
          description: Groups may be opened by link alone. Always true in link mode.
        push:
          type: boolean
          description: >-
            The server sends Web Push notifications (RFC 8030), which the app
            receives through UnifiedPush.
        vapidPublicKey:
          type: string
          description: >-
            The server's VAPID public key (RFC 8292), uncompressed and in
            unpadded base64url, for the app to subscribe with. Only when `push`
            is on.
        publicUrl:
          type: string
          description: Base URL used for group links.
          example: https://balnana.example.com
        sourceUrl:
          type: string
          description: >-
            Where to get this server's source code (AGPL-3.0). Defaults to the
            upstream repository.
          example: https://github.com/willie6666/balnana
        setupRequired:
          type: boolean
          description: >-
            No administrator password is set yet; the app sends people to
            /admin to set one.
        setupCode:
          type: boolean
          description: >-
            Setting it up also needs the code the server printed in its log.
            A server makes one whenever it starts without a password.
        privacyUrl:
          type: string
          description: >-
            The server's own privacy policy (BALNANA_PRIVACY_URL). Without it
            the app shows its built-in one.
        mapStyle:
          type: string
          description: >-
            MapLibre style URL to draw vector maps from (BALNANA_MAP_STYLE),
            when the map source is a style. At most one of `mapStyle` and
            `mapTiles` is set; with neither, maps are off and the app still
            keeps names and points, without showing a map.
          example: https://tiles.openfreemap.org/styles/liberty
        mapTiles:
          type: string
          description: >-
            Raster map tile URL template with `{z}`, `{x}` and `{y}`
            (BALNANA_MAP_TILES), when the map source is tiles.
          example: https://tile.openstreetmap.org/{z}/{x}/{y}.png
        mapAttribution:
          type: string
          description: >-
            Credit the map's provider asks to be shown on the map. Empty with
            a style: show the credits the style names.
          example: © OpenStreetMap contributors
    AdminSetupInput:
      type: object
      required: [password]
      properties:
        password:
          type: string
          description: At least 8 characters.
        code:
          type: string
          description: The setup code from the server's log, when server-info asks for one.
    AdminLoginInput:
      type: object
      required: [password]
      properties:
        password:
          type: string
    AdminSession:
      type: object
      required: [token, expiresAt]
      properties:
        token:
          type: string
          description: Send as the X-Balnana-Admin header.
        expiresAt:
          type: string
          format: date-time
    AdminSetting:
      type: object
      required: [key, default, locked, secret, set]
      properties:
        key:
          type: string
          description: The environment variable that sets it, as listed in .env.example.
          example: BALNANA_SMTP_HOST
        value:
          type: string
          description: The value in force. Never sent for secrets.
        default:
          type: string
          description: The value when nothing sets it.
        locked:
          type: boolean
          description: Set by an environment variable, which wins; it cannot be changed here.
        secret:
          type: boolean
        set:
          type: boolean
          description: Something sets it, the environment or this page.
    AdminSettings:
      type: object
      required: [settings]
      properties:
        settings:
          type: array
          items:
            $ref: "#/components/schemas/AdminSetting"
    AdminSettingsInput:
      type: object
      required: [values]
      properties:
        values:
          type: object
          additionalProperties:
            type: string
    AdminUser:
      type: object
      required: [id, name, emailVerified, hasPassword, oauth, groups, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        username:
          type: string
        emailVerified:
          type: boolean
        hasPassword:
          type: boolean
        oauth:
          type: array
          description: The providers the account signs in with.
          items:
            type: string
        groups:
          type: integer
          description: Groups the account is a current member of.
        planName:
          type: string
          description: Its current paid plan; left out on the default one.
        planExpiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    PlanLimits:
      type: object
      description: How much a plan allows. Left out means no limit.
      properties:
        receiptsPerGroup:
          type: integer
          minimum: 0
        recurringPerGroup:
          type: integer
          minimum: 0
        ownGroups:
          type: integer
          minimum: 0
        sponsoredGroups:
          type: integer
          minimum: 0
    Plan:
      type: object
      required: [id, name, rank, isDefault, limits]
      properties:
        id:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,31}$"
        name:
          type: string
        rank:
          type: integer
          description: When someone has several plans, the highest counts.
        isDefault:
          type: boolean
          description: What anyone without an entitlement has.
        limits:
          $ref: "#/components/schemas/PlanLimits"
    PlanProduct:
      type: object
      required: [provider, product, planId, days]
      properties:
        provider:
          type: string
          enum: [kofi, play]
        product:
          type: string
          description: >-
            A Ko-fi membership tier's name or a Google Play product id. Empty
            for Ko-fi: any payment of at least `minAmount` in `currency`.
        planId:
          type: string
        days:
          type: integer
          minimum: 1
          description: How long one payment lasts. Monthly ones need a few days' grace, as payments arrive late. Google Play says for itself when each payment ends, so this is ignored for it.
        minAmount:
          type: string
          description: A decimal number, such as "3.00".
        currency:
          type: string
    PlanCatalog:
      type: object
      required: [plans, products]
      properties:
        plans:
          type: array
          items:
            $ref: "#/components/schemas/Plan"
        products:
          type: array
          items:
            $ref: "#/components/schemas/PlanProduct"
    Entitlement:
      type: object
      required: [id, planId, planName, source, startsAt, createdAt]
      properties:
        id:
          type: string
        planId:
          type: string
        planName:
          type: string
        source:
          type: string
          enum: [admin, kofi, play]
        note:
          type: string
        startsAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: Left out when it never ends.
        revokedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    EntitlementList:
      type: object
      required: [entitlements]
      properties:
        entitlements:
          type: array
          items:
            $ref: "#/components/schemas/Entitlement"
    EntitlementGrant:
      type: object
      required: [planId]
      properties:
        planId:
          type: string
        days:
          type: integer
          minimum: 1
          description: Left out, it never ends.
        note:
          type: string
    PaymentState:
      type: string
      enum: [applied, unclaimed, unmatched]
    Payment:
      type: object
      required: [id, provider, kind, state, paidAt]
      properties:
        id:
          type: string
        provider:
          type: string
          enum: [kofi, play]
        kind:
          type: string
          description: What the provider called it, such as "Subscription".
        reference:
          type: string
          description: The provider's ID for the transaction.
        state:
          $ref: "#/components/schemas/PaymentState"
        email:
          type: string
        payerName:
          type: string
        amount:
          type: string
        currency:
          type: string
        product:
          type: string
        planId:
          type: string
        days:
          type: integer
        userId:
          type: string
        userName:
          type: string
        paidAt:
          type: string
          format: date-time
    PaymentList:
      type: object
      required: [payments, total]
      properties:
        payments:
          type: array
          items:
            $ref: "#/components/schemas/Payment"
        total:
          type: integer
    PaymentAssign:
      type: object
      required: [userId]
      properties:
        userId:
          type: string
        planId:
          type: string
        days:
          type: integer
          minimum: 1
    Usage:
      type: object
      required: [used]
      properties:
        used:
          type: integer
        limit:
          type: integer
          description: Left out means no limit.
    MyPlan:
      type: object
      required: [planName, paid, ownGroups, sponsoredGroups]
      properties:
        planName:
          type: string
        paid:
          type: boolean
          description: Whether it comes from an entitlement rather than being the default.
        expiresAt:
          type: string
          format: date-time
          description: When the current plan ends. Left out when it does not.
        ownGroups:
          $ref: "#/components/schemas/Usage"
        sponsoredGroups:
          $ref: "#/components/schemas/Usage"
        receiptsPerGroup:
          type: integer
        recurringPerGroup:
          type: integer
        paymentCode:
          type: string
          description: |
            What to write in a Ko-fi message so that the payment reaches this
            account. Left out when the server takes no Ko-fi payments.
        play:
          $ref: "#/components/schemas/PlayBilling"
    PlayBilling:
      type: object
      description: What can be bought through Google Play. Left out when nothing can.
      required: [accountId, packageName, products, subscribed]
      properties:
        accountId:
          type: string
          description: Give Google this with a purchase, so that it reaches this account.
        packageName:
          type: string
        products:
          type: array
          description: Subscription product ids.
          items:
            type: string
        subscribed:
          type: array
          description: The products the account has a subscription to.
          items:
            type: string
    PlayPurchaseRequest:
      type: object
      required: [purchaseToken]
      properties:
        purchaseToken:
          type: string
    PaymentClaim:
      type: object
      required: [reference]
      properties:
        reference:
          type: string
          description: The transaction ID, or the link to the payment.
    GroupPlan:
      type: object
      required: [planName, receipts, recurring, canSponsor]
      properties:
        planName:
          type: string
        sponsorMemberId:
          type: string
          description: The member who pays for this group's limits.
        receipts:
          $ref: "#/components/schemas/Usage"
        recurring:
          $ref: "#/components/schemas/Usage"
        canSponsor:
          type: boolean
          description: Whether the signed-in account could sponsor the group now.
    ServerBilling:
      type: object
      description: Present when the server charges for what it stores.
      properties:
        kofiUrl:
          type: string
    AdminUserList:
      type: object
      required: [users, total]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/AdminUser"
        total:
          type: integer
          description: Accounts matching, of which at most 200 are listed.
    PushDeviceInput:
      type: object
      required: [endpoint, p256dh, auth, groups]
      description: >-
        The device's Web Push subscription, as its UnifiedPush distributor
        gave it, and the groups it follows.
      properties:
        endpoint:
          type: string
          maxLength: 2048
          description: Where the server sends the device's messages.
        p256dh:
          type: string
          maxLength: 128
          description: The device's P-256 public key, uncompressed, in base64url.
        auth:
          type: string
          maxLength: 64
          description: The device's 16-byte authentication secret, in base64url.
        groups:
          type: array
          maxItems: 200
          description: The link groups this device knows, and who it is in each.
          items:
            type: object
            required: [token, memberId]
            properties:
              token:
                type: string
              memberId:
                type: string
    OAuthProvider:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          example: google
        name:
          type: string
          example: Google
    Error:
      type: object
      required: [code]
      properties:
        code:
          type: string
          example: not_found
        params:
          type: object
          additionalProperties: true
