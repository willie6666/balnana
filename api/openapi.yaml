openapi: 3.0.3
info:
  title: Balnana API
  version: 0.1.0
  description: |
    Group expense splitting. See docs/PLAN.md for the access model.

    Money is always a decimal string (for example "1234.50"), never a JSON
    number. The number of decimal places is the group's `minorDigits`.
    Errors carry a stable machine `code`; clients translate it.

    Any request may be answered 429 with code `rate_limited` and a
    `Retry-After` header (seconds): per client there is a request cap
    (BALNANA_RATE_LIMIT) and a cap on asking for group tokens that do not
    exist.

    Accounts mode (BALNANA_AUTH_MODE=accounts): sign in with /auth/login or
    /auth/register. The web app asks for a session cookie (`cookie: true`);
    other clients get a token to send as `Authorization: Bearer <token>`.
    Group endpoints then need a session and membership in the group, unless
    the group has link access, in which case its link alone is enough, as in
    link mode. Without a session they answer 401 `sign_in_required`; for a
    signed-in non-member, 403 `not_a_member` (see /g/{token}/join).
servers:
  - url: /api/v1
security:
  - {}
  - bearer: []
  - cookie: []
paths:
  /server-info:
    get:
      operationId: getServerInfo
      summary: Mode and enabled features, read by the app on startup
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerInfo"
  /groups:
    post:
      operationId: createGroup
      summary: Create a group with its first members
      description: >-
        The response carries the secret token. In accounts mode the creator
        must be signed in and becomes the first member.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        default:
          $ref: "#/components/responses/Error"
  /groups/summaries:
    post:
      operationId: getGroupSummaries
      summary: Home screen cards for the groups a device knows
      description: >-
        Tokens the server does not know (deleted, or the link was reset) are
        listed in `missing` so the app can forget them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupSummaryRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupSummaryList"
        default:
          $ref: "#/components/responses/Error"
  /auth/register:
    post:
      operationId: register
      summary: Create an account with email and password (accounts mode)
      description: >-
        Refused with 403 `signup_closed` when BALNANA_AUTH_SIGNUP is closed,
        or invite_only and the address has no invitation. The first account
        on a server can always be created.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Error"
  /auth/login:
    post:
      operationId: login
      summary: Sign in with email and password (accounts mode)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Error"
  /auth/logout:
    post:
      operationId: logout
      summary: End this session
      responses:
        "204":
          description: Signed out
        default:
          $ref: "#/components/responses/Error"
  /me:
    get:
      operationId: getMe
      summary: The signed-in account
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
  /me/password:
    post:
      operationId: changePassword
      summary: Set a new password; other sessions are signed out
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChange"
      responses:
        "204":
          description: Changed
        default:
          $ref: "#/components/responses/Error"
  /me/groups:
    get:
      operationId: getMyGroups
      summary: Home screen cards for the groups the account is a member of
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupSummaryList"
        default:
          $ref: "#/components/responses/Error"
  /g/{token}:
    parameters:
      - $ref: "#/components/parameters/Token"
    get:
      operationId: getGroup
      summary: The group, its members and their balances
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateGroup
      parameters:
        - $ref: "#/components/parameters/ActingMember"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        default:
          $ref: "#/components/responses/Error"
  /g/{token}/reset-link:
    parameters:
      - $ref: "#/components/parameters/Token"
    post:
      operationId: resetGroupLink
      summary: Replace the token; the old link stops working
      parameters:
        - $ref: "#/components/parameters/ActingMember"
      responses:
        "200":
          description: The group under its new token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        default:
          $ref: "#/components/responses/Error"
  /g/{token}/join:
    parameters:
      - $ref: "#/components/parameters/Token"
    get:
      operationId: getJoinInfo
      summary: What a signed-in person needs to decide to join (accounts mode)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinInfo"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: joinGroup
      summary: Become a member, as a new member or by claiming a placeholder
      description: >-
        Joining again after leaving brings the old member back. Joining when
        already a member changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinInput"
      responses:
        "200":
          description: The group, now with you in it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        default:
          $ref: "#/components/responses/Error"
  /g/{token}/members:
    parameters:
      - $ref: "#/components/parameters/Token"
    post:
      operationId: addMember
      parameters:
        - $ref: "#/components/parameters/ActingMember"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        default:
          $ref: "#/components/responses/Error"
  /g/{token}/members/{memberId}:
    parameters:
      - $ref: "#/components/parameters/Token"
      - $ref: "#/components/parameters/MemberId"
    patch:
      operationId: updateMember
      parameters:
        - $ref: "#/components/parameters/ActingMember"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: removeMember
      summary: Mark a member as having left
      description: >-
        Only members whose balance is zero can leave. They stay in past
        expenses; error `member_has_balance` otherwise.
      parameters:
        - $ref: "#/components/parameters/ActingMember"
      responses:
        "204":
          description: Removed
        default:
          $ref: "#/components/responses/Error"
  /g/{token}/expenses:
    parameters:
      - $ref: "#/components/parameters/Token"
    get:
      operationId: listExpenses
      summary: Expenses and payments, newest first
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpensePage"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createExpense
      parameters:
        - $ref: "#/components/parameters/ActingMember"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        default:
          $ref: "#/components/responses/Error"
  /g/{token}/expenses/{expenseId}:
    parameters:
      - $ref: "#/components/parameters/Token"
      - $ref: "#/components/parameters/ExpenseId"
    get:
      operationId: getExpense
      summary: One expense, also when deleted
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: updateExpense
      description: >-
        `version` must be the version that was read; otherwise the expense
        changed meanwhile and the answer is 409 `expense_version_conflict`.
      parameters:
        - $ref: "#/components/parameters/ActingMember"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteExpense
      summary: Delete (restorable)
      parameters:
        - $ref: "#/components/parameters/ActingMember"
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Error"
  /g/{token}/expenses/{expenseId}/restore:
    parameters:
      - $ref: "#/components/parameters/Token"
      - $ref: "#/components/parameters/ExpenseId"
    post:
      operationId: restoreExpense
      summary: Undo a delete
      parameters:
        - $ref: "#/components/parameters/ActingMember"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        default:
          $ref: "#/components/responses/Error"
  /g/{token}/payments:
    parameters:
      - $ref: "#/components/parameters/Token"
    post:
      operationId: createPayment
      summary: Record that one member paid another
      parameters:
        - $ref: "#/components/parameters/ActingMember"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInput"
      responses:
        "201":
          description: The payment, stored as an expense of kind `payment`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        default:
          $ref: "#/components/responses/Error"
  /g/{token}/balances:
    parameters:
      - $ref: "#/components/parameters/Token"
    get:
      operationId: getBalances
      summary: Net balances and the payments that settle them
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Balances"
        default:
          $ref: "#/components/responses/Error"
  /g/{token}/activity:
    parameters:
      - $ref: "#/components/parameters/Token"
    get:
      operationId: listActivity
      summary: What happened in the group, newest first
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityPage"
        default:
          $ref: "#/components/responses/Error"
components:
  parameters:
    Token:
      name: token
      in: path
      required: true
      description: The group's secret token from its link.
      schema:
        type: string
    MemberId:
      name: memberId
      in: path
      required: true
      schema:
        type: string
    ExpenseId:
      name: expenseId
      in: path
      required: true
      schema:
        type: string
    ActingMember:
      name: X-Balnana-Member
      in: header
      required: false
      description: >-
        Link mode: the member this device acts as, recorded in the activity
        log. Ignored when it is not a member of the group.
      schema:
        type: string
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
    cookie:
      type: apiKey
      in: cookie
      name: balnana_session
  responses:
    Error:
      description: >-
        An error. 400 for invalid input, 401 when signing in is needed, 403
        when not allowed, 404 for an unknown group or item, 409 for
        conflicts.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Money:
      type: string
      description: Decimal amount with up to the group's `minorDigits` decimals.
      example: "12.50"
    GroupCreate:
      type: object
      required: [name, currency, members]
      properties:
        name:
          type: string
        emoji:
          type: string
        color:
          type: integer
          description: 0xRRGGBB
        currency:
          type: string
          description: ISO 4217 code
          example: EUR
        minorDigits:
          type: integer
          minimum: 0
          maximum: 4
          default: 2
        members:
          type: array
          description: >-
            Names of the first members, the creator first. In accounts mode
            the first is the creator's name in this group.
          items:
            type: string
        linkAccess:
          type: boolean
          description: >-
            Accounts mode: let anyone with the link in, as in link mode.
            Ignored unless the server allows it (`linkGroups`).
    GroupUpdate:
      type: object
      properties:
        name:
          type: string
        emoji:
          type: string
          description: Empty string clears it.
        color:
          type: integer
        linkAccess:
          type: boolean
          description: >-
            Accounts mode, owners only, when the server allows it
            (`linkGroups`).
    Group:
      type: object
      required: [token, name, currency, minorDigits, createdAt, members, linkAccess]
      properties:
        token:
          type: string
        name:
          type: string
        emoji:
          type: string
        color:
          type: integer
        currency:
          type: string
        minorDigits:
          type: integer
        createdAt:
          type: string
          format: date-time
        members:
          type: array
          description: Everyone, including members who left, oldest first.
          items:
            $ref: "#/components/schemas/Member"
        linkAccess:
          type: boolean
          description: Whether the link alone opens the group (always in link mode).
        myMemberId:
          type: string
          description: 'Accounts mode: the signed-in account''s member, if any.'
    Member:
      type: object
      required: [id, name, left, balance, owner, claimed]
      properties:
        id:
          type: string
        name:
          type: string
        color:
          type: integer
        left:
          type: boolean
        owner:
          type: boolean
        claimed:
          type: boolean
          description: 'Accounts mode: an account is linked to this member.'
        balance:
          $ref: "#/components/schemas/Money"
    MemberInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        color:
          type: integer
    GroupSummaryRequest:
      type: object
      required: [groups]
      properties:
        groups:
          type: array
          maxItems: 200
          items:
            type: object
            required: [token]
            properties:
              token:
                type: string
              memberId:
                type: string
                description: Who this device is in the group, for `balance`.
    GroupSummaryList:
      type: object
      required: [groups, missing]
      properties:
        groups:
          type: array
          items:
            $ref: "#/components/schemas/GroupSummary"
        missing:
          type: array
          items:
            type: string
    GroupSummary:
      type: object
      required: [token, name, currency, minorDigits, memberCount, updatedAt]
      properties:
        token:
          type: string
        name:
          type: string
        emoji:
          type: string
        color:
          type: integer
        currency:
          type: string
        minorDigits:
          type: integer
        memberCount:
          type: integer
        balance:
          $ref: "#/components/schemas/Money"
        updatedAt:
          type: string
          format: date-time
          description: Last activity in the group.
    Share:
      type: object
      required: [memberId]
      properties:
        memberId:
          type: string
        value:
          type: string
          description: >-
            Ignored for `equal`; an amount for `exact`; a percentage for
            `percent`; a weight for `shares` (up to 4 decimals).
    PayerInput:
      type: object
      required: [memberId, amount]
      properties:
        memberId:
          type: string
        amount:
          $ref: "#/components/schemas/Money"
    ExpenseInput:
      type: object
      required: [title, amount, occurredAt, payers, splitMethod, splits]
      properties:
        title:
          type: string
        categoryId:
          type: string
        amount:
          $ref: "#/components/schemas/Money"
        occurredAt:
          type: string
          format: date-time
        note:
          type: string
        payers:
          type: array
          description: Who paid; the amounts add up to `amount`.
          items:
            $ref: "#/components/schemas/PayerInput"
        splitMethod:
          $ref: "#/components/schemas/SplitMethod"
        splits:
          type: array
          items:
            $ref: "#/components/schemas/Share"
        version:
          type: integer
          description: Required when updating.
    PaymentInput:
      type: object
      required: [fromMemberId, toMemberId, amount]
      properties:
        fromMemberId:
          type: string
        toMemberId:
          type: string
        amount:
          $ref: "#/components/schemas/Money"
        occurredAt:
          type: string
          format: date-time
          description: Defaults to now.
    SplitMethod:
      type: string
      enum: [equal, exact, percent, shares]
    Expense:
      type: object
      required: [id, kind, title, amount, occurredAt, splitMethod, payers, splits, createdAt, updatedAt, version]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [expense, payment]
        title:
          type: string
        categoryId:
          type: string
        amount:
          $ref: "#/components/schemas/Money"
        occurredAt:
          type: string
          format: date-time
        note:
          type: string
        splitMethod:
          $ref: "#/components/schemas/SplitMethod"
        payers:
          type: array
          items:
            $ref: "#/components/schemas/Payer"
        splits:
          type: array
          items:
            $ref: "#/components/schemas/SplitPart"
        createdBy:
          type: string
          description: Member id of whoever added it, when known.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
        version:
          type: integer
    Payer:
      type: object
      required: [memberId, amount]
      properties:
        memberId:
          type: string
        amount:
          $ref: "#/components/schemas/Money"
    SplitPart:
      type: object
      required: [memberId, amount]
      properties:
        memberId:
          type: string
        amount:
          $ref: "#/components/schemas/Money"
        share:
          type: string
          description: The percentage or weight entered, for `percent` and `shares`.
    ExpensePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Expense"
        nextCursor:
          type: string
    Balances:
      type: object
      required: [balances, transfers]
      properties:
        balances:
          type: array
          items:
            $ref: "#/components/schemas/MemberBalance"
        transfers:
          type: array
          description: Suggested payments that settle everyone up.
          items:
            $ref: "#/components/schemas/Transfer"
    MemberBalance:
      type: object
      required: [memberId, amount]
      properties:
        memberId:
          type: string
        amount:
          $ref: "#/components/schemas/Money"
    Transfer:
      type: object
      required: [fromMemberId, toMemberId, amount]
      properties:
        fromMemberId:
          type: string
        toMemberId:
          type: string
        amount:
          $ref: "#/components/schemas/Money"
    ActivityPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Activity"
        nextCursor:
          type: string
    Activity:
      type: object
      required: [id, action, payload, createdAt]
      properties:
        id:
          type: string
        action:
          type: string
          description: >-
            group.created, group.updated, group.link_reset, member.added,
            member.updated, member.removed, expense.created, expense.updated,
            expense.deleted, expense.restored. Payments use the expense
            actions with `kind: payment` in the payload.
        actorMemberId:
          type: string
        subjectId:
          type: string
        payload:
          type: object
          additionalProperties: true
          description: Names and amounts at the time, for rendering in any language.
        createdAt:
          type: string
          format: date-time
    RegisterInput:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
        password:
          type: string
          description: 8 to 200 characters.
        name:
          type: string
        locale:
          type: string
        cookie:
          type: boolean
          description: 'Web app: keep the session in a cookie instead of returning a token.'
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
        cookie:
          type: boolean
          description: 'Web app: keep the session in a cookie instead of returning a token.'
    Session:
      type: object
      required: [user]
      properties:
        token:
          type: string
          description: 'Send as `Authorization: Bearer <token>`. Absent with `cookie: true`.'
        user:
          $ref: "#/components/schemas/User"
    User:
      type: object
      required: [id, name, emailVerified, hasPassword]
      properties:
        id:
          type: string
        email:
          type: string
        emailVerified:
          type: boolean
        name:
          type: string
        locale:
          type: string
        hasPassword:
          type: boolean
    UserUpdate:
      type: object
      properties:
        name:
          type: string
        locale:
          type: string
          description: Empty string follows the device.
    PasswordChange:
      type: object
      required: [newPassword]
      properties:
        currentPassword:
          type: string
          description: Required when the account has a password.
        newPassword:
          type: string
    JoinInfo:
      type: object
      required: [name, currency, members, member]
      properties:
        name:
          type: string
        emoji:
          type: string
        color:
          type: integer
        currency:
          type: string
        member:
          type: boolean
          description: The account is already a member.
        members:
          type: array
          description: Current members; unclaimed ones can be claimed.
          items:
            $ref: "#/components/schemas/JoinMember"
    JoinMember:
      type: object
      required: [id, name, claimed]
      properties:
        id:
          type: string
        name:
          type: string
        color:
          type: integer
        claimed:
          type: boolean
    JoinInput:
      type: object
      properties:
        claimMemberId:
          type: string
          description: An unclaimed member to become.
        name:
          type: string
          description: Name for a new member; defaults to the account name.
    ServerInfo:
      type: object
      required: [name, version, authMode, password, signup, email, oauthProviders, linkGroups, publicUrl, sourceUrl]
      properties:
        name:
          type: string
          description: Always "balnana"; lets the app recognise a Balnana server.
          example: balnana
        version:
          type: string
          example: 0.1.0
        authMode:
          type: string
          enum: [link, accounts]
        password:
          type: boolean
          description: Email + password sign-in is available (accounts mode only).
        signup:
          type: string
          enum: [open, invite_only, closed]
        email:
          type: boolean
          description: The server can send email (verification, reset, invites).
        oauthProviders:
          type: array
          items:
            $ref: "#/components/schemas/OAuthProvider"
        linkGroups:
          type: boolean
          description: Groups may be opened by link alone. Always true in link mode.
        publicUrl:
          type: string
          description: Base URL used for group links.
          example: https://balnana.example.com
        sourceUrl:
          type: string
          description: >-
            Where to get this server's source code (AGPL-3.0). Defaults to the
            upstream repository.
          example: https://github.com/willie6666/balnana
    OAuthProvider:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          example: google
        name:
          type: string
          example: Google
    Error:
      type: object
      required: [code]
      properties:
        code:
          type: string
          example: not_found
        params:
          type: object
          additionalProperties: true
