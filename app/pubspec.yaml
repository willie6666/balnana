name: balnana
description: "Split group expenses: who paid what, who owes whom."
publish_to: 'none'

# versionName+versionCode on Android; --build-name and --build-number override them.
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  crypto: ^3.0.8
  dio: ^5.11.1
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  dynamic_color: ^2.1.0
  file_picker: ^13.3.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_map_vector_tiles: ^2.10.1
  flutter_riverpod: ^3.4.3
  flutter_timezone: ^5.1.1
  flutter_web_plugins:
    sdk: flutter
  go_router: ^18.1.1
  image_picker: ^1.2.4
  intl: ^0.20.3
  latlong2: ^0.10.1
  material_ui: ^1.8.0
  qr: ^4.0.0
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  # 6.2 adds webcrypto (a native BoringSSL build) and window_manager, which
  # Android push needs neither of: the Android connector decrypts messages itself.
  unifiedpush: ">=6.1.0 <6.2.0"
  url_launcher: ^6.3.3
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1
  image_picker_platform_interface: ^2.11.2

flutter:
  default-flavor: foss
  uses-material-design: true
  generate: true
  assets:
    - assets/fonts/OFL.txt

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
