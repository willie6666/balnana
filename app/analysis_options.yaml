include: package:flutter_lints/flutter.yaml

formatter:
  page_width: 110

analyzer:
  exclude:
    - build/**
    - android/**
    - web/**
    - lib/l10n/app_localizations*.dart
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - prefer_single_quotes
    - prefer_final_locals
    - unawaited_futures
    - directives_ordering
    - avoid_print
