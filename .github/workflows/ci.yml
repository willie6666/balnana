name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: balnana
          POSTGRES_PASSWORD: balnana
          POSTGRES_DB: balnana
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U balnana -d balnana"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://balnana:balnana@localhost:5432/balnana?sslmode=disable
      # Without it, a database that can't be reached skips the tests that need it.
      REQUIRE_DB: "1"
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      # The generated API must be what the OpenAPI file says. Its header names
      # the version as the build of oapi-codegen spells it, here or in nix.
      - run: go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.5.1
      - run: go generate ./internal/api
      - run: git diff --exit-code -I 'Code generated by' internal/api/api.gen.go
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      # Known vulnerabilities in the Go release or a dependency that the code
      # reaches. Fix by raising the go line in go.mod or the module.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: go test -race ./...

  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/deploy-debian.sh
      - run: docker compose --env-file /dev/null config --quiet
        env:
          POSTGRES_PASSWORD: ci-validation-only
