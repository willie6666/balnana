# Self-hosting Balnana:
#   cp .env.example .env    # then edit it: at least POSTGRES_PASSWORD
#   docker compose up -d --build
# The web app and API are then on http://localhost:${BALNANA_PORT:-8080}; the
# first visit there asks for the administrator password, then shows /admin.
# Put a TLS reverse proxy (Caddy, Traefik, nginx) in front for public use,
# set BALNANA_TRUST_PROXY=true, and BALNANA_BIND=127.0.0.1 when the proxy runs
# on this machine: a client that can reach the port directly could otherwise
# fake its address to the rate limits.

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: balnana
      POSTGRES_DB: balnana
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U balnana -d balnana"]
      interval: 5s
      timeout: 5s
      retries: 10

  balnana:
    build: .
    image: balnana:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      BALNANA_DATABASE_URL: postgres://balnana@db:5432/balnana?sslmode=disable
      # Apart from the URL, so the password may hold any character.
      BALNANA_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      # Empty unless .env sets it, so it can be set at /admin instead.
      BALNANA_PUBLIC_URL: ${BALNANA_PUBLIC_URL:-}
    ports:
      - "${BALNANA_BIND:-0.0.0.0}:${BALNANA_PORT:-8080}:8080"

volumes:
  db-data:
